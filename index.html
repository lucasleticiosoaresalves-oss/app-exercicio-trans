const EVID=[
 {id:'entonacao',area:'Voz',af:'Entonação muda como a voz é ouvida, e isso tem ensaio aleatorizado nos dois sentidos',forca:'media',
  por:'Num ensaio aleatorizado com 23 pessoas trans e de gênero diverso que buscavam voz mais masculina, ouvintes sem informação sobre o estudo classificaram as vozes como significativamente mais masculinas depois do treino de entonação, e as próprias pessoas relataram a voz mais alinhada com a identidade. Existe ensaio equivalente para quem busca voz mais feminina. É um achado importante porque entonação — a melodia da fala, o quanto a voz sobe e desce — não é altura nem ressonância: é um terceiro elemento, e por muito tempo o treino se concentrou só nos dois primeiros. As amostras são pequenas e o seguimento é curto.',
  no:'A entonação deixou de ser um exercício entre dez e virou um bloco com nome e explicação própria na tela de voz, com a direção certa para cada trilha. Também entrou a comparação entre ritmo intensivo e espalhado, que num estudo com 34 pessoas rendeu parecido: dá para escolher o seu ritmo sem perder resultado.',
  fontes:['ent_masc','ent_fem','voz_ritmo']},
 {id:'azelaico',area:'Pele',af:'Ácido azelaico funciona para acne e também para mancha, e é a opção para quem não tolera retinoide',forca:'forte',
  por:'Em dezesseis ensaios aleatorizados sobre acne, o ácido azelaico a 20% reduziu mais lesões que o veículo: a redução de cravos ficou perto de 70%, contra 14% do veículo, e aos três meses 64% das pessoas tinham melhora boa ou excelente, contra 36%. A revisão Cochrane de tratamentos tópicos, com 13 revisões e 46 ensaios, inclui o azelaico entre os com evidência, ressalvando que a qualidade metodológica dos estudos é baixa. Ele age em três frentes ao mesmo tempo: antibacteriana, anti-inflamatória e sobre a produção de melanina — por isso serve para acne e para a mancha escura que fica depois da espinha.',
  no:'Entrou na lista de ativos como alternativa ao adapaleno, com indicação explícita de quando preferir um ou outro: azelaico para quem tem mancha junto com acne, para quem tem rosácea, e para quem não aguentou a irritação do retinoide. É menos irritante e pode ser usado de manhã, o que o retinoide não pode.',
  fontes:['azelaico','azel_mec','cochrane_acne']},
 {id:'niacinamida',area:'Pele',af:'Niacinamida clareia mancha quase tanto quanto hidroquinona, com muito menos efeito indesejado',forca:'media',
  por:'Num ensaio duplo-cego aleatorizado comparando niacinamida a 4% com hidroquinona a 4% em melasma, 44% das pessoas tiveram melhora boa ou excelente com a niacinamida contra 55% com a hidroquinona — resultado um pouco menor, mas com bem menos efeito indesejado relatado. A niacinamida também aparece na revisão Cochrane de tópicos para acne. Não é um ativo forte: é um ativo seguro, que quase ninguém precisa suspender.',
  no:'É o ativo sugerido para quem está começando e tem medo de irritar a pele, e o que pode ser usado junto com quase tudo. A tela de pele diz onde ele ajuda de verdade — mancha e oleosidade — e onde ele não vai resolver sozinho.',
  fontes:['niacin_melasma','cochrane_acne']},
 {id:'pele_cor',area:'Pele',af:'Mancha escura depois de espinha e de pelo encravado é mais comum e mais difícil de tirar em pele parda e negra',forca:'media',
  por:'A mancha escura que fica depois que a inflamação passa acontece em qualquer pele, mas tem predileção clara por tons mais escuros, e nas revisões aparece como um dos motivos mais frequentes de busca por dermatologista entre pessoas negras. A revisão sistemática de 2024 reuniu 48 estudos e 1.356 pessoas de pele parda e negra — 70% negras — e mediu o que funciona: retinoide tópico foi a intervenção mais estudada e deu melhora PARCIAL em 85%; laser deu melhora parcial em 66% e resolução completa em 26% de um subgrupo, mas com casos relatados de PIORA da mancha depois do tratamento. Peeling químico e hidroquinona saíram pior. A conclusão dos autores é dura e honesta: nenhuma modalidade mostrou eficácia robusta. A revisão mais antiga, que é a que organiza o tratamento, põe duas coisas em primeiro lugar — tratar a inflamação que está causando, e protetor solar — e lista como clareadores com alguma evidência o ácido azelaico, a niacinamida, os retinoides e a vitamina C, que são justamente os ativos que este app já tinha. Sobre o pelo encravado da barba, a revisão de 2023 diz que a condição atinge predominantemente pessoas de pele negra, que o tratamento de base é tópico, e que laser aparece como a opção de longo prazo.',
  no:'Entrou um bloco de pele parda e negra na aba de Aparência, e ele corrige coisas que o app vinha dizendo errado: o corretivo que neutraliza sombra de barba é alaranjado em pele clara e avermelhado ou cor de tijolo em pele escura, e "um tom abaixo da sua pele" para contorno não funciona igual em todo tom. O bloco também diz por que filtro solar mineral deixa a pele acinzentada e o que usar no lugar. O passo de pelo encravado da barba ganhou fonte.',
  masnao:'Não prova que existe tratamento bom. Prova o contrário: a própria revisão diz que falta eficácia robusta em todas as modalidades, e que laser pode piorar. Nada aqui é indicação de procedimento, e mancha que não melhora é consulta com dermatologista, não ativo de farmácia comprado por conta. Os estudos também são quase todos de amostra de consultório, com 78% de mulheres, e nenhum foi feito em pessoas trans.',
  fontes:['pih_rev','pih_davis','pfb_rev']},
 {id:'comida_humor',area:'Comida',af:'Mudar a alimentação reduziu sintomas de depressão num ensaio feito para testar isso',forca:'media',
  por:'A maior parte do que se diz sobre comida e humor vem de estudo observacional, que mostra as coisas andando juntas. O ensaio SMILES é diferente: ele sorteou pessoas com depressão moderada a grave entre uma intervenção alimentar de padrão mediterrâneo e um grupo de apoio social, por 12 semanas, e quem mudou a alimentação teve queda maior dos sintomas. É um ensaio pequeno, de doze semanas, com avaliação cega apenas parcial. No PREDIMED, que não foi desenhado para depressão, o grupo da dieta mediterrânea com castanhas teve risco menor, mas sem significância estatística. Uma meta-análise de 2025 reuniu as intervenções alimentares em depressão e ansiedade.',
  no:'É o motivo de o app não tratar comida só como caloria. O padrão que foi testado é o de sempre: mais legume, fruta, grão integral, feijão, peixe e azeite; menos ultraprocessado e doce. Nenhuma receita daqui promete tratar depressão, e isso está escrito — mas a direção do cardápio não é estética, é essa.',
  fontes:['smiles','predimed_dep','dieta_meta']},
 {id:'distribuicao',area:'Comida',af:'O total do dia manda; onde a proteína cai no dia é ajuste fino',forca:'media',
  por:'O position stand da ISSN sobre proteína coloca o total diário em 1,4 a 2,0 g por quilo como o que de fato constrói e mantém músculo, e trata a distribuição como fator secundário: cerca de 0,25 g por quilo por refeição, ou 20 a 40 g, a cada 3 ou 4 horas. O stand sobre momento de ingestão acrescenta que carboidrato com proteína em volta do treino ajuda força e composição corporal, e que proteína de boa qualidade até cerca de 2 horas depois do treino aumenta a síntese proteica.',
  no:'O cardápio sugerido passa a olhar o seu treino do dia: a refeição antes e a depois preferem receita com carboidrato e proteína juntos, e as refeições principais preferem as que batem o piso de proteína por refeição. O total de calorias do dia não muda por causa do treino — isso já está no fator de atividade do perfil.',
  masnao:'Os próprios stands dizem que o efeito da distribuição e do momento é MENOR que o do total diário. Se você bate a proteína do dia, a hora em que ela entrou muda pouco. Nada aqui justifica correr para tomar shake em trinta minutos: essa janela estreita não se sustentou nos estudos.',
  fontes:['issn_prot','issn_timing']},
 {id:'acucar_liquido',area:'Bebidas',af:'Caloria líquida com açúcar engorda mais que a mesma caloria mastigada',forca:'media',
  por:'Uma revisão sistemática de 2022 juntou coortes prospectivas e ensaios aleatorizados, em crianças e adultos, e achou efeito sobre o peso de cerca de 0,83 kg, com dose-resposta: quanto mais, pior. Uma análise encomendada pela OMS chegou a 0,75 kg, com intervalo de confiança de 0,30 a 1,19 kg. Cada porção a mais por dia aparece associada a 0,07 kg/m² de IMC. A explicação mais aceita é que líquido sacia pouco e o corpo não desconta no resto do dia.',
  no:'A tela de bebidas separa o que tem açúcar do que não tem, e diz quanto açúcar tem numa lata. O app não proíbe nada: só para de tratar bebida como se fosse água.',
  masnao:'A parte da saciedade vem quase toda de estudo curto, de uma refeição só. Um protocolo registrado diz com todas as letras que não dá para extrapolar isso para ganho de peso no longo prazo. E falta dado mostrando que trocar por versão sem caloria evita o ganho.',
  fontes:['ssb_ajcn22','ssb_oms']},
 {id:'suco',area:'Bebidas',af:'Suco 100% fruta não é refrigerante, mas também não é fruta',forca:'fraca',
  por:'Uma meta-análise de 2025 com 14 coortes não achou ligação significativa entre suco 100% fruta e diabetes tipo 2, enquanto o suco que não é 100% apareceu com risco maior (RR 1,15, intervalo de 1,03 a 1,28). Em ensaios aleatorizados, suco 100% não aumentou peso comparado a placebo. Em coortes, aumentou.',
  no:'O app separa suco natural de suco de caixinha, em vez de jogar os dois no mesmo saco, e sugere comer a fruta inteira — que é onde está a fibra.',
  masnao:'Coorte e ensaio discordam, e ninguém resolveu isso. Uma revisão guarda-chuva ainda achou associação desfavorável para suco 100% e diabetes (RR 1,07). É por isso que aqui está marcado como evidência limitada, e não como fato.',
  fontes:['suco_ajm25','suco_guarda']},
 {id:'adocante',area:'Bebidas',af:'Adoçante não é atalho para emagrecer — mas a evidência contra ele é fraca',forca:'fraca',
  por:'A OMS recomendou em 2023 não usar adoçante não calórico para controle de peso. É importante ler o que essa recomendação é: ela é CONDICIONAL, e a própria OMS classificou a certeza da evidência como baixa. Ensaios curtos mostraram perda pequena de peso, que não se sustentou. Estudos observacionais longos ligaram consumo maior a ganho de peso.',
  no:'O app não manda cortar nem manda usar. Refrigerante zero aparece como o que é: melhor que a versão com açúcar para a conta de caloria, e sem promessa de emagrecimento.',
  masnao:'O achado observacional pode ser causalidade reversa: quem já engordou é quem troca açúcar por adoçante. Críticos publicados argumentam que a OMS deu pouco peso aos ensaios aleatorizados, que apontam para benefício quando o adoçante substitui o açúcar.',
  fontes:['adocante_oms','adocante_critica']},
 {id:'alcool',area:'Bebidas',af:'Não existe dose de álcool conhecida como livre de risco',forca:'media',
  por:'Em janeiro de 2023 a OMS afirmou, em declaração na Lancet Public Health, que não se conhece quantidade de álcool livre de efeito sobre a saúde, e que para câncer não existe nível seguro. Cerca de metade dos cânceres atribuíveis ao álcool na Europa aparece em quem não bebe pesado.',
  no:'A tela diz isso e para por aí. O app não registra dose, não conta e não cobra: cobrança não ajuda ninguém a beber menos.',
  masnao:'O risco absoluto em consumo leve é pequeno, e há quem argumente que a qualidade de vida compensa. O que a OMS aponta é outra coisa: o suposto benefício cardiovascular depende de com quem você compara — "quem bebe moderado" costuma ser comparado com abstêmios que são ex-bebedores ou já estão doentes, o que faz a bebida leve parecer protetora.',
  fontes:['alcool_oms','alcool_cancer']},
 {id:'cafeina',area:'Comida',af:'Até 400 mg de cafeína por dia, e longe da hora de dormir',forca:'media',
  por:'Quatrocentos miligramas por dia é o limite citado como consumo moderado para adulto saudável — mais ou menos quatro xícaras de café coado. Acima disso a evidência sobre o excesso é limitada, e não existe limite definido para adolescentes. Numa meta-análise de estudos controlados, a cafeína cortou cerca de 45 minutos do tempo total de sono. Em outra, de 2024, aumentou pontuações de ansiedade em pessoas saudáveis, com efeito bem mais forte em quem tem transtorno de pânico. Em ensaios aleatorizados, suplemento de cafeína subiu pouco a pressão: perto de 1,9 mmHg na sistólica. Sobre o café em si, uma revisão guarda-chuva de meta-análises concluiu que ele é seguro no consumo usual, com as maiores reduções de risco entre três e quatro xícaras — mas isso é associação, não causa.',
  no:'A tela de bebidas diz o limite e diz as duas coisas que mais aparecem na prática: cafeína à tarde tira sono de verdade, e quem tem ansiedade costuma sentir mais. Não existe recomendação de cortar café aqui — existe a conta para você decidir.',
  fontes:['cafeina_fda','cafe_umbrella']},
 {id:'raiva',area:'Hormônios',af:'Testosterona não deixa a pessoa agressiva, ao contrário do estereótipo',forca:'media',
  por:'Uma revisão de 7 estudos prospectivos com 664 homens trans achou resultado inconsistente: quatro relataram algum aumento em medidas ligadas a agressividade, um relatou queda, e todos tinham risco de viés de moderado a alto, com seguimento menor que 12 meses. Um estudo prospectivo com 56 pessoas não encontrou aumento de agressividade, e apontou a ansiedade como preditor mais forte do que a testosterona. Num acompanhamento com 178 adolescentes e jovens trans, 69,6% mantiveram níveis normais de raiva durante todo o período. O que sobra de mais consistente é que emoção fica mais perto da superfície, não que a pessoa fique agressiva.',
  no:'A tela de hormônios diz isso com os números, em vez de repetir o estereótipo. E trata pavio curto como sinal para investigar sono, dor, ansiedade e disforia — não como "é a T". Também diz, em destaque, para nunca mexer em dose por causa de humor.',
  fontes:['raiva_rev','defreyne18','huit26']},
 {id:'osso',area:'Hormônios',af:'A hormonização não derruba o osso; o que derruba é ficar sem hormônio nenhum',forca:'media',
  por:'A revisão que reúne o assunto, de 2022, diz que a hormonização afirmativa em pessoas adultas não está associada a perda óssea importante. Na meta-análise de 14 estudos e 1.484 homens trans, a densidade óssea não mudou de forma significativa na coluna, no quadril, no colo do fêmur nem no corpo inteiro depois de 12 e de 24 meses de testosterona, e o P1NP, que é marcador de formação de osso, subiu — o que aponta para efeito anabólico, não para perda. O ponto de atenção é outro, e é em mulheres trans: a prevalência de massa óssea baixa já é alta ANTES de começar o tratamento. No estudo brasileiro do Hospital de Clínicas de Porto Alegre, 18% das 142 mulheres trans avaliadas tinham massa óssea baixa para a idade, contra nenhuma pessoa do grupo de comparação, e isso apareceu ligado a massa magra menor, não ao hormônio; nas 46 reavaliadas depois de 31 meses a densidade ficou estável, enquanto a massa magra caiu. Em adolescentes, o bloqueio puberal sozinho prejudica o desenvolvimento do osso, com recuperação ao menos parcial depois que a hormonização começa. Sobre o que dá para fazer: na meta-análise de 84 grupos de exercício, todos os tipos de treino melhoraram a densidade óssea na coluna, no colo do fêmur e no quadril, com os efeitos maiores do treino de força no quadril.',
  no:'Entrou um bloco de osso na tela de exames, com os três pontos que a literatura aponta: não interromper a hormonização por conta própria, ainda mais depois de cirurgia que retira gônada; cálcio e vitamina D; e treino de força. Densitometria óssea entrou na lista de exames que dá para anotar. O alvo de cálcio do painel de micronutrientes passou a ter fonte, e a linha que já dizia que treino de força protege o osso virou um número.',
  masnao:'Quase tudo aqui é densidade medida por densitometria, que é um desfecho intermediário: o que importa é fratura, e a própria revisão diz que falta dado sobre risco de fratura em pessoas trans. Os seguimentos são curtos — 12 e 24 meses não dizem nada sobre trinta anos. E a meta-análise de exercício é em mulheres na pós-menopausa, que não é a mesma população: ela entra aqui como a melhor evidência disponível sobre treino e osso, não como estudo em pessoas trans.',
  fontes:['osso_rev','osso_t','osso_br','osso_exerc']},
 {id:'ciclo',area:'Ciclo',af:'Acompanhar o ciclo porque menstruar é gatilho de disforia',forca:'media',
  por:'Numa revisão de prontuários de 129 adolescentes transmasculinos, 93% relataram disforia ligada à menstruação e 88% tinham interesse em suprimir. São estudos retrospectivos, de poucos serviços, então mostram o tamanho do problema melhor do que mostram solução. Para quem usa estradiol injetável não existe literatura parecida: o que se relata sobre variação ao longo do intervalo é muito menos estudado e depende da via e da dose.',
  no:'Na trilha masculinizar e na de melhorar, o app prevê a próxima menstruação depois de dois ou três registros e deixa marcar sintomas por dia. Na trilha feminilizar não existe previsão nenhuma, só registro ao longo do intervalo da dose — porque prever sem base seria invenção. Nada aqui sugere supressão: isso passa por receita e por quem te acompanha.',
  fontes:['menstrual']},
 {id:'rosto',area:'Aparência',af:'Sobrancelha, mandíbula e contraste são o que o olho usa para atribuir gênero a um rosto',forca:'media',
  por:'Um estudo clássico que trocava traços entre rostos encontrou mandíbula, sobrancelha e olhos, e queixo como os que mais mudam o gênero percebido. Uma análise com 922 pessoas colocou espessura de sobrancelha, proeminência da mandíbula e altura do rosto como os traços de maior peso para masculinidade, com efeitos de tamanho pequeno a moderado. E um terceiro estudo mostrou que a sombra em volta dos olhos e da boca sustenta a identificação rápida de gênero. São amostras controladas e pequenas, então a ordem exata dos traços não necessariamente vale fora do laboratório.',
  no:'É a lógica de toda a aba de Aparência. Maquiagem feminilizante aumenta o contraste em volta dos olhos e da boca e afina a sobrancelha; a masculinizante faz o contrário, engrossa a sobrancelha e marca o ângulo do maxilar. As dicas de roupa não vêm daqui: são convenção de alfaiataria, e isso está escrito na própria tela.',
  fontes:['brownperrett93','rosto18','luminancia09']},
 {id:'passar',area:'Aparência',af:'Ser lida ou lido como você é tem relação com ansiedade e depressão',forca:'fraca',
  por:'Na coorte STRONG, ser percebida ou percebido conforme o gênero afirmado apareceu associado a menos ansiedade e depressão, e era mais comum em quem relatava mais aceitação e orgulho da própria identidade. O estudo é transversal: mostra que as coisas andam juntas, não que uma causa a outra, e os próprios autores pedem estudos prospectivos. Do outro lado, o que aparece com força como determinante de saúde mental é estigma — assédio, violência e discriminação —, em pesquisa com 1.178 pessoas trans. E "passar" é um conceito contestado dentro da própria comunidade, inclusive por ter sido usado para acusar pessoas trans de enganar os outros.',
  no:'A aba de Aparência abre dizendo isso, nessa ordem: é caixa de ferramentas, a evidência é de associação e não de causa, o que mais pesa é estigma, e não passar não é falha de ninguém. Nenhuma tela do app mede passabilidade nem dá nota.',
  fontes:['to20','estigma_nz']},
 {id:'binder',area:'Corpo',af:'Binder tem risco físico real, e dia de folga importa',forca:'media',
  por:'No maior estudo sobre o assunto, com 1.800 pessoas, mais de 97% relataram pelo menos um efeito negativo: dor, calor excessivo, falta de ar. Cinquenta pessoas relataram fratura de costela. Curiosamente, binder comercial apareceu associado a mais desfechos que improviso, o que os autores não conseguiram explicar e levantaram como possível uso errado, tipo sobrepor dois ou usar um número abaixo. É autorrelato e transversal, então mostra associação. O que não está em dúvida: faixa, atadura, plástico filme e fita adesiva são os piores caminhos.',
  no:'O app nunca manda treinar de binder nem trata binder como neutro. Onde ele aparece, aparece com folga, com limite de horas e com o aviso de que esforço com o peito comprimido restringe a respiração.',
  fontes:['peitzmeier17']},
 {id:'arfid',area:'Comida',af:'Alimentação restritiva é muito mais comum em pessoas trans do que na população geral',forca:'media',
  por:'Num serviço de transtorno alimentar, 16,7% das pessoas em tratamento para ARFID se identificavam como trans, não binárias ou de gênero diverso — pessoas de gênero diverso são menos de 2% da população. Traços autistas e de TDAH são de 2 a 6 vezes mais comuns em pessoas de gênero diverso, e num estudo com 182 adultos de gênero diverso a hipersensibilidade sensorial previu sintomas de ARFID mesmo descontando esses traços. São estudos transversais e de amostra clínica.',
  no:'Ainda não está construído, e isso está dito com todas as letras em "O que este app não tem", dentro de Cuidados. Está lá marcado como coisa que precisa de nutricionista: orientação alimentar errada piora ARFID em vez de ajudar. O que existe hoje e ajuda é poder esconder os números, no Perfil.',
  fontes:['arfid25']},
 {id:'pares',area:'Humor e rotina',af:'Apoio de outras pessoas trans protege, mas a versão online quase não foi estudada',forca:'fraca',
  por:'Numa revisão sistemática sobre apoio social, o apoio vindo de outras pessoas trans foi o fator mais frequentemente associado a saúde e bem-estar. Mas uma revisão de escopo com 34 estudos sobre apoio entre pares e risco de suicídio encontrou que o apoio online entre pessoas trans é raramente examinado, e pediu pesquisa que dê conta disso. Ou seja: o que protege é apoio de pares, e justamente a forma que um app poderia oferecer é a que não tem evidência.',
  no:'É por isso que comunidade está na lista do que exige estudo e não na dos itens fáceis, com aviso de risco próprio: sem moderação de verdade, um espaço com 36% de menores de 18 anos é perigoso. O que o app faz hoje é o caminho oposto, de não expor ninguém: tudo fica no aparelho.',
  fontes:['pares_rev','kia_pares']},
 {id:'freq',area:'Treino',af:'Cada grupo muscular grande treina duas vezes por semana',forca:'forte',
  por:'Uma meta-análise que comparou só a frequência, mantendo o volume semanal igual, achou mais hipertrofia quando o grupo era treinado duas vezes na semana em vez de uma. A conclusão vale para os grupos grandes: peito, costas, ombro, perna.',
  no:'Todos os ciclos das três trilhas distribuem esses grupos em dois dias diferentes da semana. Foi por isso que entraram os treinos Pernas B e Superior Completo B: para o segundo dia não ser a repetição idêntica do primeiro.',
  fontes:['schoenfeld16']},
 {id:'volume',area:'Treino',af:'De 10 a 20 séries por grupo muscular por semana',forca:'forte',
  por:'Duas revisões independentes chegam perto disso. Uma aponta a faixa de 12 a 20 séries semanais para quem já treina; a outra, uma meta-regressão, mostra que o ganho continua subindo com mais séries, mas cada vez menos depois de umas 11, e que 10 a 20 rende mais que 4 a 9.',
  no:'As séries de cada fase foram contadas para ficar nessa faixa. A tela de volume da semana soma suas séries por grupo e avisa quando você está abaixo ou muito acima.',
  fontes:['bazvalle22','pelland24']},
 {id:'descanso',area:'Treino',af:'1 a 2 minutos de descanso entre séries, 2 a 3 quando o foco é força',forca:'media',
  por:'A revisão com meta-análise sobre intervalos encontrou o melhor resultado de hipertrofia entre 1 e 2 minutos, e vantagem para intervalos acima de 2 a 3 minutos quando o objetivo é força máxima.',
  no:'Cada exercício tem o descanso escrito do lado, e o cronômetro já abre com esse tempo. Nos exercícios pesados de 5 e 6 repetições o descanso sobe para 2 e 3 minutos.',
  fontes:['singer24','descanso_sch']},
 {id:'falha',area:'Treino',af:'Pare 1 ou 2 repetições antes de não conseguir mais',forca:'media',
  por:'A meta-análise sobre proximidade da falha não achou vantagem clara em levar a série até não conseguir mais: o efeito foi trivial com a definição mais ampla de falha e desapareceu com a definição estrita. Como a fadiga cobra mais caro, parar perto da falha entrega o mesmo por menos.',
  no:'As observações dos exercícios dizem "até faltar 1" ou "até faltar 2" em vez de "até falhar". Onde o treino pede falha de propósito, é só na última série de um acessório leve.',
  fontes:['refalo23']},
 {id:'progressao',area:'Treino',af:'Subir a carga quando você fechar todas as séries com folga',forca:'forte',
  por:'A relação entre estímulo e resultado é de dose: nas meta-regressões, mais trabalho rende mais, até um ponto. Carga parada por semanas significa dose parada.',
  no:'Cada exercício guarda o histórico de carga e o 1RM estimado, então dá para ver num relance se a carga subiu ou ficou parada. As observações dos treinos dizem na cara quando subir: "suba a carga quando fechar as 4 séries com folga". A cada oito semanas entra uma semana mais leve, para a conta não virar só acúmulo.',
  fontes:['pelland24','bazvalle22']},
 {id:'creatina',area:'Treino',af:'Creatina é o único suplemento de treino com evidência forte — e o efeito dela é pequeno',forca:'forte',
  por:'O position stand da International Society of Sports Nutrition é a revisão mais completa do assunto e conclui duas coisas: a creatina monoidratada melhora o desempenho em esforço intenso e as adaptações ao treino, e o uso de curto e de longo prazo é seguro e bem tolerado em pessoas saudáveis — ele cita até 30 g por dia por cinco anos. A dose de manutenção recomendada é bem menor, de 3 a 5 g por dia, ou 0,1 g por quilo, e não existe necessidade de fase de saturação. O tamanho do efeito vem de outro lugar, e é honesto dizer que é pequeno: uma meta-análise de 2023 que mediu músculo direto, por ressonância, tomografia ou ultrassom, em 10 ensaios e 44 desfechos, achou 0,11 em desvio padrão a favor da creatina somada ao treino, com intervalo que passa pelo zero, e de 0,10 a 0,16 cm de espessura muscular. Quem mais ganha é quem come pouca ou nenhuma carne: numa revisão de nove estudos em pessoas vegetarianas, a creatina subiu massa magra, força, resistência muscular e potência, muitas vezes acima do que subia em onívoros, porque a reserva delas começava mais baixa.',
  no:'Entrou um bloco de creatina no plano de treino, com dose, preço, o que ela não faz e o aviso sobre o exame de creatinina. É o único suplemento que o app menciona por nome próprio. A lista de comida barata foi corrigida junto: ela dizia que suplemento não vale o dinheiro, o que continua certo para whey, barrinha e shake, e é errado para creatina.',
  masnao:'Pequeno é pequeno. Creatina não substitui treinar, comer proteína e dormir, e quem não faz essas três coisas não vai notar diferença nenhuma. Boa parte dos autores das revisões sobre creatina declara ligação com empresas que a fabricam, e essa declaração está impressa nos próprios artigos — vale ler. E nenhum destes estudos foi feito em pessoas trans nem olhou para interação com hormonização.',
  fontes:['crea_issn','crea_duvidas','crea_hiper','crea_veg']},

 {id:'tmb',area:'Comida',af:'Gasto em repouso pela fórmula de Mifflin-St Jeor',forca:'media',
  por:'Na comparação entre as fórmulas de estimativa, Mifflin-St Jeor foi a que acertou dentro de 10% do valor medido na maior parte das pessoas, e a que menos erra sempre para o mesmo lado. É a mais recomendada para uso geral. Mesmo assim é estimativa: pode estar 10% acima ou abaixo do seu gasto real, e erra mais em quem tem obesidade.',
  no:'É a conta que gera sua meta de calorias, e ela é refeita a cada pesagem nova. Depois de algumas semanas de registro o app passa a mostrar também o gasto estimado pelos seus próprios dados, que vale mais que a fórmula.',
  fontes:['frankenfield05']},
 {id:'prot',area:'Comida',af:'1,8 g de proteína por quilo, ou 2,2 g quando você está perdendo peso',forca:'forte',
  por:'A meta-análise com 49 estudos e 1.863 pessoas encontrou o ponto em que a proteína extra para de render ganho perto de 1,6 g por quilo por dia. O intervalo de confiança é largo, então um alvo pouco acima tem margem. Em déficit calórico o valor sobe porque a proteína é o que segura a massa magra enquanto o peso cai.',
  no:'A meta de proteína sai do seu peso atual e muda junto com ele. O diário mostra quanto falta e as receitas são ordenadas por densidade de proteína.',
  fontes:['morton18']},
 {id:'fibra',area:'Comida',af:'De 25 a 29 g de fibra por dia é onde a curva de risco mais cai',forca:'forte',
  por:'A série de revisões publicada na Lancet em 2019 juntou 185 estudos prospectivos e 58 ensaios clínicos — quase 135 milhões de pessoas-ano. Comparando quem come mais fibra com quem come menos, a mortalidade por qualquer causa, a doença coronariana, o derrame, o diabetes tipo 2 e o câncer de intestino aparecem de 15 a 30% menores, e a redução de risco é maior quando a ingestão do dia fica entre 25 e 29 g. Nos ensaios aleatorizados, que são a parte forte do conjunto, mais fibra deu peso, pressão sistólica e colesterol total menores. A curva de dose-resposta sugere que acima de 29 g o benefício ainda continua subindo. Para intestino preso existe meta-análise própria, com 16 ensaios e 1.251 pessoas: responderam ao tratamento 66% de quem recebeu fibra contra 41% de quem recebeu controle, e o que funcionou foi dose acima de 10 g por dia, por pelo menos 4 semanas, com psyllium e pectina.',
  no:'Os 25 g por dia do painel "Além das calorias" passam a ter fonte, e o texto do alvo passa a dizer que 25 é o piso de uma faixa que vai até 29, não um teto. O painel também ganhou o aviso de que a conta é um piso: ela soma só os alimentos que estão na tabela.',
  masnao:'A parte de mortalidade e de câncer vem de estudo observacional. Quem come mais fibra em geral também fuma menos, se mexe mais e tem mais dinheiro, e nenhum ajuste estatístico resolve isso por completo — os próprios autores classificaram a certeza como moderada. E a meta-análise de intestino achou mais gases no grupo da fibra: aumentar de uma vez incomoda, aumentar aos poucos não.',
  fontes:['fibra_lancet','fibra_intest']},
 {id:'ferro',area:'Comida',af:'Menstruar é a causa mais comum de falta de ferro, e isso costuma passar batido',forca:'media',
  por:'A revisão de 2023 na American Journal of Obstetrics and Gynecology trata o ponto de frente: menstruação intensa é muito comum e é a principal causa de deficiência de ferro em idade reprodutiva, e a relação entre as duas coisas é normalizada — por quem sangra, por quem convive e pelos próprios serviços de saúde. Falta de ferro pesa no dia a dia antes de virar anemia: cansaço, dificuldade de concentração, falta e queda de rendimento na escola e no trabalho. Do outro lado está o medo de quem usa testosterona, e aí o número é tranquilizador: num corte de 6.670 pessoas em hormonização, 8,4% tinham hematócrito de 50% ou mais, 2,7% de 52% ou mais e 0,9% de 54% ou mais. A média ficou dentro da faixa normal em todos os níveis de testosterona, e foi um pouco maior na via intramuscular que na transdérmica — 44,96% contra 43,41%.',
  no:'O alvo de ferro do painel "Além das calorias" é de 18 mg para quem menstrua e 8 mg para quem não menstrua, e quem decide qual dos dois vale é o seu registro de ciclo, não a sua trilha. Na tela de Ciclo entrou um bloco com o que levar para a consulta e por que ferritina mostra o problema antes da anemia. Ferritina, hemoglobina e hematócrito já estavam na lista de exames que dá para anotar.',
  masnao:'O app não diagnostica e não sugere suplemento de ferro a ninguém. Ferro em excesso faz mal, e tomar por conta própria pode esconder uma causa de sangramento que precisa ser investigada. A conta de ferro do diário é um piso, não um total: ela soma só os alimentos que estão na tabela.',
  fontes:['ferro_mens','ferro_t']},
 {id:'agua',area:'Comida',af:'Meta de água pela referência europeia de ingestão adequada',forca:'media',
  por:'A conta de 35 ml por quilo circula em todo lugar, mas não achei recomendação oficial que a sustente. O que existe é a ingestão adequada da EFSA: 2,0 L por dia para mulheres e 2,5 L para homens, de água TOTAL — e de 20 a 30% disso vem da própria comida. Sobra perto de 1,6 e 2,0 L para beber. Nos dias de treino entra a reposição do suor.',
  no:'Era aqui que o app estava errado: a meta antiga era 35 ml por quilo mais 500 ml, o que dava quase 3 litros de bebida para 70 kg. Agora parte da referência da EFSA e soma 500 ml só em dia de treino. É valor de referência, não necessidade exata: sede e urina clara dizem mais, e você pode ajustar a meta na mão.',
  fontes:['efsa10']},
 {id:'deficit',area:'Comida',af:'Déficit de 20% para perder e superávit de 15% para ganhar',forca:'sem',
  por:'Esses dois percentuais são convenção de prática, não número saído de estudo. Não achei ensaio que fixe 20% ou 15% como o melhor. O que é bem estabelecido é a direção: para perder gordura é preciso comer menos que o gasto, e déficits muito agressivos custam massa magra.',
  no:'Ficaram como ponto de partida, com dois cuidados: a meta nunca desce abaixo do seu gasto em repouso, e tudo pode ser ajustado na mão no Perfil. Se o peso não se mexer em três semanas, o número está errado para você — e aí o app usa seus próprios registros para corrigir.',
  fontes:[]},

 {id:'gordura',area:'Corpo e medidas',af:'Gordura corporal estimada pela fita, pelas circunferências',forca:'fraca',
  por:'Comparado com DXA em militares da ativa, o método de circunferências subestimou a gordura dos homens em cerca de 2,5 pontos percentuais e superestimou a das mulheres entre 1,3 e 2,3 pontos. Os próprios autores dizem que serve para triagem, não para dado de pesquisa.',
  no:'O número aparece como tendência, não como verdade: o que interessa é a direção ao longo dos meses, não o valor absoluto. A margem de erro de uns 3 pontos está escrita na própria tela.',
  fontes:['marines22']},

 {id:'voz',area:'Voz',af:'Treino vocal muda a frequência da voz de verdade',forca:'media',
  por:'A meta-análise de 16 estudos em mulheres trans encontrou aumento médio de cerca de 27 Hz na vogal sustentada, 39 Hz na leitura e 25 Hz na fala espontânea, com satisfação alta. Uma meta-análise maior, de 2025, com 24 estudos e 893 pessoas, confirmou efeito grande da terapia vocal sobre a frequência — e levantou o ponto mais importante para quem treina: altura sozinha pode não mudar como a pessoa é ouvida, porque ressonância pesa e é mais difícil de medir que Hz. Um ensaio aleatorizado cruzado com 30 mulheres trans, ao longo de 14 semanas, comparou treino de altura, treino de ressonância e os dois juntos. Dois detalhes se repetem em tudo: o número de sessões não previu o resultado, e não existe protocolo padronizado — o que mais pesa é a orientação de um fonoaudiólogo.',
  no:'O ciclo de 7 dias existe para dar constância, não porque 7 seja número mágico. O app registra sua frequência em Hz e mostra o gráfico, mas trata o Hz como termômetro e não como objetivo, justamente porque altura sozinha pode não bastar: por isso os exercícios de ressonância têm o mesmo peso que os de altura. E repete, nas telas de voz, que acompanhamento com fonoaudiólogo é o que faz diferença.',
  fontes:['schwarz23','voz25','leyns24']},
 {id:'sovt',area:'Voz',af:'Canudo e vibração de lábio para aquecer a voz',forca:'fraca',
  por:'Os exercícios de trato vocal semiocluído têm resultado de curto prazo demonstrado em ensaio randomizado e em estudos de programa, mas a evidência de efeito duradouro ainda é fina. Canudo e vibração de lábio rendem parecido entre si.',
  no:'Entram como aquecimento antes dos exercícios de altura e ressonância, que é o uso com melhor respaldo. Não são apresentados como o que muda a voz.',
  fontes:['kapsner15']},

 {id:'retinoide',area:'Pele',af:'Adapaleno, sozinho ou com peróxido de benzoíla, para acne',forca:'forte',
  por:'A meta-análise em rede com 40 ensaios e 18.089 participantes colocou adapaleno com peróxido de benzoíla como o tratamento tópico mais eficaz contra veículo, e adapaleno sozinho em terceiro. Uma revisão de 8 ensaios randomizados confirma a combinação como segura e eficaz, e um ensaio com 323 pacientes mostrou adapaleno melhor tolerado que tretinoína. Os autores da meta-análise em rede classificam a confiança geral como baixa, e o efeito indesejado mais comum é irritação.',
  no:'É o ativo indicado para acne na rotina da noite, com a instrução de começar duas ou três vezes por semana e subir devagar. A evidência é de acne leve a moderada: acne nodular ou com cicatriz é caso de dermatologista.',
  fontes:['stuart21','adapaBpo24','adapa96']},
 {id:'filtro',area:'Pele',af:'Filtro solar todo dia, de manhã',forca:'forte',
  por:'No ensaio randomizado de Nambour, quem usou filtro solar diariamente por 4,5 anos apresentou menos sinais de envelhecimento da pele que quem usava só às vezes. O mesmo grupo, seguido por mais oito anos, teve queda de quase 40% em carcinoma espinocelular. A ressalva é que quase toda essa evidência vem de uma população australiana de pele clara.',
  no:'Filtro solar é o único passo que aparece na rotina da manhã em todas as trilhas e em todos os tipos de pele. É também o passo que o app cobra de volta se você usar ativo à noite.',
  fontes:['nambour13']},

 {id:'exerc_humor',area:'Humor e rotina',af:'Exercício reduz sintomas depressivos',forca:'media',
  por:'A meta-análise em rede com 218 estudos e 14.170 participantes encontrou efeito moderado para caminhada e corrida, ioga, treino de força e exercício aeróbico misto, comparados a cuidado habitual. Caminhada e corrida lideraram, e força e ioga foram as modalidades que as pessoas mais conseguiram manter. O efeito foi proporcional à intensidade e valeu igual para quem tinha e para quem não tinha outras doenças. A confiança da análise é baixa para caminhada e muito baixa para o resto.',
  no:'É a base da trilha de quem só quer melhorar: três sessões curtas por semana, força e caminhada, sem divisão avançada e sem escalar para cinco dias. É também o motivo de a caminhada ser sempre oferecida como troca em dia ruim, em qualquer trilha.',

function evidDe(id){return EVID.find(z=>z.id===id)}

/* Selo clicável que aparece ao lado de um número ou de uma orientação. */
function selo(id,txt){const v=evidDe(id);if(!v)return '';
 return '<button class="selo" data-a="evid" data-id="'+id+'" title="De onde vem este número">'+
  ic('book')+esc(txt||FORCA[v.forca][0])+'</button>'}

function blocoFonte(k){const f=FONTES[k];if(!f)return '';
 return '<a class="fonte" href="'+esc(linkFonte(k))+'" target="_blank" rel="noopener">'+
  '<span class="grow">'+esc(f.r)+'</span>'+ic('right','color:var(--ink-3);flex:none')+'</a>'}

function fichaEvid(v,semTitulo){
 const fc=FORCA[v.forca];

 return '<div class="card" id="ev-'+v.id+'">'+
  '<div class="stack" style="gap:7px;margin-bottom:11px">'+
   '<span class="tag '+fc[1]+'" style="align-self:flex-start">'+esc(fc[0])+'</span>'+

  '<p class="tiny" style="line-height:1.65;margin:4px 0 11px">'+esc(v.por)+'</p>'+
  (v.masnao?'<div class="lbl">O que isto não prova</div>'+
    '<p class="tiny" style="line-height:1.65;margin:4px 0 11px;color:var(--ink-2)">'+esc(v.masnao)+'</p>':'')+
  '<div class="lbl">O que o app faz com isso</div>'+

   ?'<hr class="sep"><div class="lbl" style="margin-bottom:6px">'+(v.fontes.length>1?'Fontes':'Fonte')+'</div>'+

 {id:'fat_cirurgia',area:'Cirurgia',forca:'media',
  t:'Arrependimento depois de cirurgia afirmativa é raro nos estudos',
  d:'A meta-análise mais citada juntou 27 estudos e achou arrependimento de cerca de 1% no total: menos de 1% nas cirurgias transmasculinas, menos de 1% na mastectomia e perto de 2% na vaginoplastia. Uma revisão sistemática de 2024, que juntou os dados de outro jeito, chegou a 1,94% no geral e 0,8% nas pessoas transmasculinas. As duas revisões apontam os mesmos problemas: não existe questionário padronizado de arrependimento, o tempo de acompanhamento varia muito entre os estudos, e quem se arrepende tem mais motivo para sair do acompanhamento e desaparecer da conta.',

 {id:'fat_nome',area:'Nome e apoio',forca:'fraca',
  t:'Poder usar o nome escolhido aparece ligado a menos depressão e menos ideação suicida',
  d:'Um estudo com 129 jovens trans de 15 a 21 anos, em três cidades, perguntou em quantos lugares a pessoa conseguia usar o nome escolhido: casa, escola, trabalho e entre amigos. Quanto mais lugares, menores foram depressão, ideação e comportamento suicida — e os valores mais baixos foram de quem usava o nome nos quatro. Um relato do estudo aponta queda de 29% na ideação e de 56% no comportamento suicida por cada lugar a mais. O desenho é transversal e a amostra é pequena: mostra que as coisas andam juntas, não que uma causa a outra. Na mesma direção, uma revisão sistemática de 2022 ligou apoio de mãe, pai ou responsável a menos suicidalidade, e notou que esse apoio é procurado e raramente oferecido.',

 {id:'fat_osso',area:'Hormonização',forca:'media',ev:'osso',

  d:'A revisão que reúne o assunto, de 2022, conclui que a hormonização afirmativa em pessoas adultas não está associada a perda óssea importante. Para quem usa testosterona existe meta-análise: 14 estudos, 1.484 homens trans, e a densidade óssea não mudou de forma significativa na coluna, no quadril, no colo do fêmur nem no corpo inteiro depois de 12 e de 24 meses — e o P1NP, que é marcador de formação de osso, subiu. Para mulheres trans o quadro é diferente do que o boato sugere: a massa óssea baixa costuma já estar lá ANTES de começar. No estudo brasileiro do Hospital de Clínicas de Porto Alegre, 18% das 142 mulheres trans avaliadas tinham massa óssea baixa para a idade, contra nenhuma do grupo de comparação, e isso apareceu ligado a massa magra menor, não ao hormônio. O que a literatura de fato aponta como risco é o oposto: passar tempo sem hormônio nenhum, sobretudo depois de cirurgia que retira ovário ou testículo. Em adolescentes, o bloqueio puberal isolado prejudica o desenvolvimento do osso, com recuperação ao menos parcial quando a hormonização começa.',

function viewFatos(){

 const sel=areas.indexOf(S.ui.fatoArea)>=0?S.ui.fatoArea:'';
 const lista=sel?FATOS.filter(f=>f.area===sel):FATOS;
 return '<div class="card hero">'+chTtl('book','Fatos, com o estudo atrás',
   '<span class="tag n">'+FATOS.length+' assuntos</span>')+
  '<p class="tiny" style="line-height:1.7">Assuntos que chegam distorcidos na conversa. '+
  'De cada um: o que o estudo achou, de quantas pessoas, e o que ele não prova. '+
  'Texto em português, link para o original.</p>'+
  '<p class="xtiny muted" style="margin-top:10px;line-height:1.6">Onde a evidência é fraca, está escrito que é fraca. '+
  'Nenhum fato daqui é receita ou recomendação, e nenhum vale mais do que o que quem te acompanha disse.</p></div>'+
  '<div class="row wrap" style="gap:5px">'+
   '<button class="chip xs'+(sel?'':' on')+'" data-a="fato-area" data-v="">tudo</button>'+

  /* Sete fatos abertos davam dez telas. A afirmação de cada um já é o

  lista.map(function(f){

  'Me diga qual: estudo que contradiz vale mais do que o que está escrito. '+
  '<a href="mailto:'+EMAIL_CONTATO+'">'+esc(EMAIL_CONTATO)+'</a></p></div>';
}

let timerInt=null;
function pararTimer(){clearInterval(timerInt);const b=$('#timerBar');if(b)b.remove()}
function iniciaTimer(seg){
 pararTimer();
 let s=Math.max(5,seg||60);
 const el=document.createElement('div');el.id='timerBar';el.className='timerbar';
 document.body.appendChild(el);
 const tick=()=>{
  if(s<=0){clearInterval(timerInt);
   el.innerHTML='<span style="font-weight:700;font-size:14px">Vamos para a próxima série</span>'+
    '<button data-a="timer-stop" aria-label="Fechar">'+ic('x')+'</button>';
   if(navigator.vibrate)try{navigator.vibrate([180,90,180])}catch(e){}
   setTimeout(()=>{const x=$('#timerBar');if(x)x.remove()},5000);return}
  const mm=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');
  el.innerHTML='<span class="num" style="font-size:20px;font-weight:600">'+mm+':'+ss+'</span>'+
   '<span class="xtiny" style="opacity:.7">descanso</span>'+
   '<button data-a="timer-mais" style="font-size:12px;font-weight:700;opacity:.85">+30s</button>'+
   '<button data-a="timer-stop" aria-label="Parar">'+ic('x')+'</button>';
  s--;
 };
 tick();timerInt=setInterval(tick,1000);
 iniciaTimer._add=n=>{s+=n};
}

/* Planilha com um dia por linha, separada por ponto e vírgula, que é o que
   o Excel em português espera. O BOM no começo preserva os acentos. */
function baixarCSV(){
 const cab=['data','kcal','proteina_g','carboidrato_g','gordura_g','agua_ml','peso_kg',
  'treino','sono_h','passos','voz','pele_manha','pele_noite'];
 const pesoDe={};S.pesos.forEach(p=>{pesoDe[p.d]=p.v});
 const linhas=[cab];
 Object.keys(S.dias).sort().forEach(d=>{
  const x=S.dias[d],t=totalDia(d);
  linhas.push([d,Math.round(t.kcal),n1(t.p),n1(t.c),n1(t.g),x.agua||0,pesoDe[d]||'',
   (x.treino||{}).feito?'sim':'nao',x.sono||'',x.passos||'',
   (x.voz||{}).feito?'sim':'nao',(x.pele||{}).manha?'sim':'nao',(x.pele||{}).noite?'sim':'nao']);
 });
 if(linhas.length<2)return toast('Ainda não há dias registrados');
 const csv=linhas.map(l=>l.join(';')).join('\r\n');
 try{
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='norte-'+hoje()+'.csv';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
  toast((linhas.length-1)+' dias na planilha');
 }catch(e){copiar(csv,'Planilha copiada')}
}

  case 'seming-rm':{
   const l=(S.perfil.semIng||[]).slice();l.splice(+d.i,1);
   S.perfil.semIng=l;S.ui.cardapio=null;S.ui.refTudo=false;save();render();break}
  case 'voz-medir':sheetMedirVoz();break;
  case 'voz-medida-ok':{
   const hz=Number(d.v);
   if(hz>=VOZ_MIN_HZ&&hz<=VOZ_MAX_HZ){
    S.vozLog=(S.vozLog||[]).filter(function(l){return l.d!==hj});
    S.vozLog.push({d:hj,hz:hz});
    pararMedidor();save();closeSheet();render();toast('Guardado: '+hz+' Hz');
   }
   break}
  case 'mental-esc':{
   const v=+d.v;
   if(d.k==='humor'){const x=dia(hj);x.humor=(x.humor===v?0:v)}
   else{const m=mental(hj);m[d.k]=(m[d.k]===v?0:v)}
   save();render();break}
  case 'mental-gat':{
   const m=mental(hj),i2=m.gat.indexOf(d.v);
   if(i2>=0)m.gat.splice(i2,1);else m.gat.push(d.v);
   save();render();break}
  case 'restr':{
   const l=(S.perfil.restricoes||[]).slice(),i2=l.indexOf(d.v);
   if(i2>=0)l.splice(i2,1);else l.push(d.v);
   S.perfil.restricoes=l;
   /* O cardápio de hoje foi montado com a regra antiga: refaz. */
   S.ui.cardapio=null;S.ui.refTudo=false;save();render();
   toast(l.length?RECIPES.filter(recPassa).length+' receitas combinam':'Sem restrição marcada');
   break}
  case 'novo-cardapio':S.ui.cardapio=gerarCardapio(Math.floor(Math.random()*9999));render();toast('Novo cardápio');break;
  case 'trocar-ref':sheetTrocar(d.m);break;
  case 'escolher-ref':S.ui.cardapio.itens[d.m]=d.id;closeSheet();render();break;
  case 'registrar-cardapio':{let n=0;
   MEALS.forEach(ref=>{const r=RECIPES.find(z=>z.id===S.ui.cardapio.itens[ref.k]);
    if(r&&!(xf.ref[ref.k]||[]).length){addItem(df,ref.k,{n:r.nome,q:r.rende,kcal:r.kcal,p:r.p,c:r.c,g:r.g},true);n++}});
   render();toast(n?n+' refeições registradas':'As refeições de hoje já estão preenchidas');break}

  /* despensa e compras */
  case 'desp-add':{const inp=$('#despIn'),v=inp.value.trim();
   if(v){v.split(/[,;]/).map(z=>z.trim()).filter(Boolean).forEach(z=>{
    if(!S.despensa.map(nrm).includes(nrm(z)))S.despensa.push(z)});inp.value='';save('base');render()}break}
  case 'desp-tog':{const i2=S.despensa.map(nrm).indexOf(nrm(d.v));
   if(i2>=0)S.despensa.splice(i2,1);else S.despensa.push(d.v);save('base');render();break}
  case 'desp-rm':S.despensa.splice(Number(d.i),1);save('base');render();break;
  case 'desp-limpa':S.despensa=[];save('base');render();break;
  case 'add-compras':{const itens=String(d.v).split('|').filter(Boolean);let n=0;
   itens.forEach(t=>{if(!S.compras.some(c=>nrm(c.t)===nrm(t))){S.compras.push({t,ok:false});n++}});
   save('base');closeSheet();toast(n+' itens na lista de compras');render();break}
  case 'comp-add':{const inp=$('#compIn'),v=inp.value.trim();
   if(v){S.compras.push({t:v,ok:false});inp.value='';save('base');render()}break}
  case 'comp-tog':S.compras[Number(d.i)].ok=!S.compras[Number(d.i)].ok;save('base');render();break;
  case 'comp-rm':S.compras.splice(Number(d.i),1);save('base');render();break;
  case 'compras-limpa':S.compras=S.compras.filter(c=>!c.ok);save('base');render();toast('Marcados removidos');break;
  case 'copiar-compras':copiar(S.compras.filter(c=>!c.ok).map(c=>'- '+c.t).join('\n'),'Lista copiada');break;

  /* progresso */
  case 'add-peso':{const v=Number($('#pesoIn').value);if(!v)return toast('Digite o peso');
   S.pesos=S.pesos.filter(p=>p.d!==hj);S.pesos.push({d:hj,v});S.pesos.sort((a2,b2)=>a2.d<b2.d?-1:1);
   S.perfil.peso=v;save('base');render();toast('Peso registrado');break}
  case 'rm-peso':S.pesos=S.pesos.filter(p=>p.d!==d.d);save('base');render();break;
  case 'med-sel':S.ui.medSel=d.v;render();break;
  case 'add-medida':{const m2={d:hj};let tem=false;
   CAMPOS.forEach(([k])=>{const el2=$('#md_'+k),v=Number(el2&&el2.value);if(v){m2[k]=v;tem=true}});
   if(!tem)return toast('Preencha pelo menos uma medida');
   S.medidas=S.medidas.filter(z=>z.d!==hj);S.medidas.push(m2);S.medidas.sort((a2,b2)=>a2.d<b2.d?-1:1);
   save('base');render();toast('Medição salva');break}
  case 'rm-medida':S.medidas=S.medidas.filter(z=>z.d!==d.d);save('base');render();break;
  case 'foto-del':{S.fotos=S.fotos.filter(f=>f.id!==d.id);fotoApagar(d.id);save();render();toast('Foto removida');break}
  case 'copiar-resumo':copiar(($('#leituraTxt')||{}).textContent||'','Resumo copiado');break;

  /* dados */
  case 'exportar':exportarTudo();break;
  case 'importar':sheet('Importar dados',
   '<p class="tiny muted" style="line-height:1.65;margin-bottom:11px">Escolha o arquivo <b>norte-....json</b> que você baixou '+
   'no outro aparelho. O que já está aqui é mantido; o que vier no arquivo entra por cima.</p>'+
   '<label class="btn gh bl sm" style="display:block;text-align:center;cursor:pointer">'+
    ic('plus')+' Escolher o arquivo do backup'+
    '<input type="file" id="impArq" accept="application/json,.json" style="display:none"></label>'+
   '<hr class="sep"><p class="xtiny muted" style="line-height:1.6;margin-bottom:9px">Ou cole o texto, se o backup que você tem '+
   'veio por mensagem em vez de arquivo. Backup colado não traz as fotos: elas só cabem no arquivo.</p>'+
   '<textarea id="impTxt" placeholder="Cole o texto aqui" style="min-height:140px;font-family:var(--f-m);font-size:11px"></textarea>'+
   '<button class="btn acc bl" style="margin-top:11px" data-a="importar-ok">Importar o texto colado</button>',
   'Trazer dados de outro aparelho');break;
  case 'importar-ok':importarTexto(($('#impTxt')||{}).value||'');break;
  case 'zerar-dia':{S.dias[hj]={d:hj,ref:{},agua:0,treino:{feito:false,sets:{}},voz:{feito:false,min:0,ex:{}},
   pele:{manha:false,noite:false},hab:{},sono:0,passos:0,humor:0,nota:''};
   save('dia',hj);render();toast('Dia de hoje zerado');break}
 }
});

document.addEventListener('change',ev=>{
 if(ev.target&&ev.target.id==='impArq'){
  const f=ev.target.files&&ev.target.files[0];
  if(!f)return;
  const fr=new FileReader();
  fr.onload=function(){importarTexto(String(fr.result||''))};
  fr.onerror=function(){toast('Não consegui abrir esse arquivo')};
  fr.readAsText(f);
  return;
 }
 const kg=ev.target.closest('[data-a="kg"]');
 if(kg){const nome=kg.dataset.n,v=Number(kg.value);
  if(!v||!isFinite(v)||v<0||v>1000)return;
  const reps=parseInt(kg.dataset.r)||10;
  S.cargas[nome]=(S.cargas[nome]||[]).filter(r=>r.d!==hoje());
  S.cargas[nome].push({d:hoje(),kg:v,reps});
  save('base');toast('Carga anotada: '+v+' kg');return}
 const dn=ev.target.closest('[data-a="dia-num"]');
 if(dn){const x=dia(hoje());x[dn.dataset.f]=Number(dn.value)||0;
  if(dn.dataset.f==='sono'&&x.sono>=7)x.hab.sono=true;
  if(dn.dataset.f==='passos'&&x.passos>=8000)x.hab.passos=true;
  save('dia',hoje());return}
});
document.addEventListener('click',ev=>{
 const b=ev.target.closest('.subtab[data-st]');if(!b)return;
 const mapa={treinoTabs:'treino',nutriTabs:'nutri',progTabs:'prog'};
 const g=mapa[(b.parentElement||{}).id];
 if(g){S.ui.sub[g]=b.dataset.st;window.scrollTo(0,0);render()}
});
document.addEventListener('click',ev=>{
 const b=ev.target.closest('#tabbar button[data-tab]');if(!b)return;
 S.ui.tab=b.dataset.tab;window.scrollTo(0,0);render();
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape')closeSheet();
 if(ev.key!=='Enter')return;
 const map={despIn:'desp-add',pesoIn:'add-peso',compIn:'comp-add',lembIn:'lemb-add',hzIn:'add-voz',minIn:'add-voz'};
 const act=map[ev.target.id];
 if(act){ev.preventDefault();const b=document.querySelector('[data-a="'+act+'"]');if(b)b.click()}
});

/* =====================================================================
   INÍCIO
   ===================================================================== */
lsLoad();
/* garante que as listas novas existam e sejam próprias deste estado,
   mesmo em dados salvos por uma versão anterior */
S.salvos=Array.isArray(S.salvos)?S.salvos.slice():[];
S.trocas=(S.trocas&&typeof S.trocas==='object')?Object.assign({},S.trocas):{};
S.meds=Array.isArray(S.meds)?S.meds.filter(m=>m&&m.id&&m.n):[];
S.higMeus=Array.isArray(S.higMeus)?S.higMeus.filter(m=>m&&m.id&&m.n):[];
S.perfil.higMin=Array.isArray(S.perfil.higMin)?S.perfil.higMin:[];
S.notas=Array.isArray(S.notas)?S.notas:[];
S.perfil.ocultar=Array.isArray(S.perfil.ocultar)?S.perfil.ocultar:[];
S.perfil.alarmes=Array.isArray(S.perfil.alarmes)?S.perfil.alarmes:[];
S.perfil.avisosOff=Array.isArray(S.perfil.avisosOff)?S.perfil.avisosOff:[];
if(['zero','algum','avancado'].indexOf(S.perfil.nivel)<0)S.perfil.nivel='zero';
S.perfil.limites=Array.isArray(S.perfil.limites)?S.perfil.limites.filter(x=>LIMITES.some(l=>l.id===x)):[];
if(!METAS_CORPO.some(m=>m.id===S.perfil.corpoMeta))S.perfil.corpoMeta='';
S.ficha=(S.ficha&&typeof S.ficha==='object')?Object.assign({},S.ficha):{};
S.externo=Object.assign({ativo:false,fonte:'',treino:{},dieta:[]},S.externo||{});
S.th=Object.assign({freq:14,hist:[]},S.th||{});
S.ciclo=Object.assign({regras:[],sintomas:{}},S.ciclo||{});
S.ciclo.regras=Array.isArray(S.ciclo.regras)?S.ciclo.regras:[];
S.ciclo.sintomas=(S.ciclo.sintomas&&typeof S.ciclo.sintomas==='object')?S.ciclo.sintomas:{};
S.th.hist=Array.isArray(S.th.hist)?S.th.hist.slice():[];
if(!S.perfil.inicio)S.perfil.inicio=hoje();
migrar();
/* Na primeira abertura o app vai direto para o Perfil, para a pessoa decidir
   o que quer ver e o que não quer antes de qualquer número aparecer na frente
   dela. Depois que ela confirma, nunca mais força essa tela. */
if(!S.perfil.viuOcultar){
 S.ui.tab='perfil';
 /* Menor de 18 começa com peso e gordura escondidos. É padrão, não trava:
    a pessoa muda no mesmo cartão. Vem de dado próprio — 36% das respostas
    brasileiras da pesquisa são de menores de 18. */
 if(Number(S.perfil.idade||99)<18){
  const o=S.perfil.ocultar||[];
  ['peso','gordura'].forEach(function(k){if(o.indexOf(k)<0)o.push(k)});
  S.perfil.ocultar=o;
 }
}
aplicaTema();
telaSenha();
/* última conferência antes de desenhar qualquer coisa: se o que estava
   gravado no navegador estiver torto, ele é consertado aqui. */
const foraDaFaixa=normalizaTudo();
render();
ligaCabecalhoMini();
/* marca a área no corpo: é o que faz a cor da tela trocar */
(function(){const r2=window.render;window.render=function(){
 r2.apply(null,arguments);
 if(document.body.dataset.area!==S.ui.tab)document.body.dataset.area=S.ui.tab;
}})();
document.body.dataset.area=S.ui.tab;
/* depois de cada render as faixas de sub-abas voltam ao começo; isto põe a
   ativa de volta no campo de visão */
(function(){const r=render;window.render=function(){r.apply(null,arguments);centralizaSubAba()}})();
if(foraDaFaixa.length)setTimeout(function(){
 toast('Ajustei '+foraDaFaixa.join(', ')+' para um valor possível.');
},900);
setInterval(()=>{if(S.ui.tab==='inicio'&&!$('#sheetBox'))renderInicio()},60000);

/* =====================================================================
   SERVICE WORKER
   É o que faz o app abrir sem internet e instalar na tela inicial. Era o
   pedido mais votado da pesquisa.

   O cuidado que vale a pena ter: quando sai versão nova, o navegador
   baixa por trás e fica esperando. Trocar na hora significaria a tela
   mudar embaixo da pessoa no meio de um treino. Então o app avisa e
   deixa ela trocar quando quiser.
   ===================================================================== */
if('serviceWorker' in navigator){
 window.addEventListener('load',function(){
  navigator.serviceWorker.register('./sw.js').then(function(reg){
   function avisaNova(sw){
    if(!sw)return;
    sw.addEventListener('statechange',function(){
     if(sw.state==='installed'&&navigator.serviceWorker.controller)mostraAtualizacao(reg);
    });
   }
   if(reg.waiting&&navigator.serviceWorker.controller)mostraAtualizacao(reg);
   avisaNova(reg.installing);
   reg.addEventListener('updatefound',function(){avisaNova(reg.installing)});
  }).catch(function(){/* sem service worker o app funciona igual, só precisa de rede */});

  let recarregando=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
   if(recarregando)return;recarregando=true;location.reload();
  });
  window.mostraAtualizacao=function(reg){
   if(document.querySelector('#avisoVersao'))return;
   const el=document.createElement('div');
   el.id='avisoVersao';el.className='timerbar';
   el.innerHTML='<span class="grow tiny">Tem uma versão nova do app pronta.</span>'+
    '<button class="btn sm" id="btVersao">Atualizar</button>'+
    '<button class="btn gh sm" id="btVersaoNao">Depois</button>';
   document.body.appendChild(el);
   el.querySelector('#btVersao').onclick=function(){
    lsFlush();
    if(reg.waiting)reg.waiting.postMessage('assumir');else location.reload();
   };
   el.querySelector('#btVersaoNao').onclick=function(){el.remove()};
  };
 });
}
</script>

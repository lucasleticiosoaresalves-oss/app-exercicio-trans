<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Treino, alimentação, voz e pele organizados dia a dia, o ano inteiro.">
<meta name="theme-color" content="#9fdffb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#123c53" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Norte</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Reset mínimo. O resto do estilo está no bloco principal, dentro do corpo. */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: app shell mobile-first — painel do dia no topo com a faixa da bandeira,
   conteúdo rolável, barra de abas fixa. Azul e rosa da bandeira como as duas cores
   funcionais; o branco da bandeira é a superfície dos cartões. */
:root{
  --flag-blue:#5BCEFA;--flag-pink:#F5A9B8;--flag-white:#FFFFFF;
  --bg:#eef5fa;
  --surface:#ffffff;
  --surface-2:#e9f2f9;
  --surface-3:#dcebf5;
  --line:#d3e4ef;
  --line-2:#b5d2e4;
  --ink:#16232f;
  --ink-2:#4d6376;
  --ink-3:#8298a9;
  --blue:#1683bd;
  --blue-soft:#d8eefb;
  --pink:#c1566f;
  --pink-soft:#fbe2e8;
  --primary:var(--blue);
  --primary-soft:var(--blue-soft);
  --accent:var(--pink);
  --accent-soft:var(--pink-soft);
  --water:#1683bd;--water-soft:#d8eefb;
  --ok:#2c8f70;--ok-soft:#d8efe8;
  --warn:#b2802a;--warn-soft:#f7ecd6;
  --bad:#c0504f;--bad-soft:#fae0df;
  --hdr:linear-gradient(135deg,#9fdffb 0%,#c8dcf4 48%,#f7c2cd 100%);
  --hdr-top:#9fdffb;
  --hdr-fg:#13222e;
  --hdr-dim:rgba(19,34,46,.62);
  --hdr-chip:rgba(255,255,255,.52);
  --sh-1:0 1px 2px rgba(22,35,47,.05);
  --sh-2:0 1px 2px rgba(22,35,47,.05),0 10px 28px -18px rgba(22,35,47,.35);
  --r:16px;--r-s:11px;
  --f-d:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-b:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-m:'IBM Plex Mono',ui-monospace,'Courier New',monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071017;--surface:#0f1b24;--surface-2:#16242f;--surface-3:#1d2f3c;--line:#22343f;--line-2:#324752;
  --ink:#e7f0f6;--ink-2:#a0b5c3;--ink-3:#6f8798;
  --blue:#61c7f2;--blue-soft:#0e2d3f;--pink:#f09cb0;--pink-soft:#3a1d25;
  --water:#61c7f2;--water-soft:#0e2d3f;
  --ok:#55b795;--ok-soft:#0d2a23;--warn:#d4a44e;--warn-soft:#2b2311;--bad:#e07b78;--bad-soft:#331a1a;
  --hdr:linear-gradient(135deg,#123c53 0%,#1d2f45 48%,#4a2230 100%);
  --hdr-top:#123c53;--hdr-fg:#eaf4fa;--hdr-dim:rgba(234,244,250,.66);--hdr-chip:rgba(255,255,255,.12);
  --sh-1:0 1px 2px rgba(0,0,0,.5);--sh-2:0 1px 2px rgba(0,0,0,.5),0 12px 30px -20px #000;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#071017;--surface:#0f1b24;--surface-2:#16242f;--surface-3:#1d2f3c;--line:#22343f;--line-2:#324752;
  --ink:#e7f0f6;--ink-2:#a0b5c3;--ink-3:#6f8798;
  --blue:#61c7f2;--blue-soft:#0e2d3f;--pink:#f09cb0;--pink-soft:#3a1d25;
  --water:#61c7f2;--water-soft:#0e2d3f;
  --ok:#55b795;--ok-soft:#0d2a23;--warn:#d4a44e;--warn-soft:#2b2311;--bad:#e07b78;--bad-soft:#331a1a;
  --hdr:linear-gradient(135deg,#123c53 0%,#1d2f45 48%,#4a2230 100%);
  --hdr-top:#123c53;--hdr-fg:#eaf4fa;--hdr-dim:rgba(234,244,250,.66);--hdr-chip:rgba(255,255,255,.12);
  --sh-1:0 1px 2px rgba(0,0,0,.5);--sh-2:0 1px 2px rgba(0,0,0,.5),0 12px 30px -20px #000;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:88px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--hdr-top)}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
a{color:var(--blue);text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-m);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  flex:none;display:inline-block;vertical-align:-.13em}
@keyframes up{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.anim>*{animation:up .34s both}
.anim>*:nth-child(2){animation-delay:.04s}.anim>*:nth-child(3){animation-delay:.08s}
.anim>*:nth-child(4){animation-delay:.12s}.anim>*:nth-child(n+5){animation-delay:.16s}

/* faixa da bandeira — azul, rosa, branco, rosa, azul */
.flagbar{height:5px;width:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--flag-blue) 0 20%,var(--flag-pink) 20% 40%,
   var(--flag-white) 40% 60%,var(--flag-pink) 60% 80%,var(--flag-blue) 80% 100%)}

/* ---------- painel do dia ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;color:var(--hdr-fg);background:var(--hdr);
  padding-left:var(--gl);padding-right:var(--gr);padding-block:13px 0;
  border-radius:0 0 22px 22px;box-shadow:0 10px 26px -20px rgba(0,0,0,.6);overflow:hidden}
.hdr .in{max-width:760px;margin:0 auto}
.hdr .flagbar{margin-top:11px;border-radius:0;margin-left:calc(var(--gl)*-1);margin-right:calc(var(--gr)*-1);width:auto}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;font-weight:700;color:var(--hdr-dim)}
.hdr h1{font-size:21px;font-weight:800;margin-top:1px;letter-spacing:-.02em}
.hdr .sub{font-size:12px;color:var(--hdr-dim);margin-top:2px}
.hpill{background:var(--hdr-chip);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;
  white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.hpill b{font-family:var(--f-m);font-weight:700}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:11px}
.wstrip button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0 6px;border-radius:9px;
  background:var(--hdr-chip);transition:.15s;opacity:.72}
.wstrip button.now{opacity:1;box-shadow:inset 0 0 0 1.5px currentColor}
.wstrip .d{font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;opacity:.7}
.wstrip .n{font-family:var(--f-m);font-size:12px;font-weight:700}
.wstrip .b{width:16px;height:3px;border-radius:2px}

/* ---------- shell ---------- */
.page{padding-left:var(--gl);padding-right:var(--gr);padding-block:15px 10px;max-width:760px;margin:0 auto;
  display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px}
.card.lift{box-shadow:var(--sh-2)}
.card.hero{border-color:var(--line-2);position:relative;overflow:hidden}
.card.hero::before{content:"";position:absolute;inset:0 0 auto;height:4px;
  background:linear-gradient(90deg,var(--flag-blue) 0 20%,var(--flag-pink) 20% 40%,
   var(--flag-white) 40% 60%,var(--flag-pink) 60% 80%,var(--flag-blue) 80% 100%)}
.card.hero{padding-top:18px}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:11px}
.ch h2{font-size:16.5px}.ch h3{font-size:14.5px}
.ch .ttl{display:flex;align-items:center;gap:8px;min-width:0}
.ch .ttl .ic{font-size:17px;color:var(--blue)}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:var(--ink-3)}
.muted{color:var(--ink-2)}.tiny{font-size:12px}.xtiny{font-size:11px}
.row{display:flex;flex-direction:row;align-items:center;gap:9px}
.row.wrap{flex-wrap:wrap}.row.top{align-items:flex-start}
.spread{justify-content:space-between}.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:9px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.gauto{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--blue);color:#fff;
  border-radius:11px;padding:11px 16px;font-size:14px;font-weight:600;transition:transform .1s,filter .12s;text-align:center}
.btn:active{transform:scale(.975)}.btn:hover{filter:brightness(1.09)}
.btn.acc{background:var(--pink)}.btn.wtr{background:var(--water)}.btn.dark{background:var(--ink);color:var(--bg)}
.btn.gh{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.gh:hover{background:var(--surface-3);filter:none}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
.btn.xs{padding:5px 10px;font-size:11.5px;border-radius:8px;font-weight:600}
.btn.bl{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;transition:.12s;color:var(--ink)}
.chip:hover{border-color:var(--line-2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.rm{background:transparent;border-color:var(--line);color:var(--ink-3);font-size:11.5px;padding:4px 9px}
.chip.xs{font-size:11.5px;padding:4px 9px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:3px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.p{background:var(--blue-soft);color:var(--blue)}
.tag.a{background:var(--pink-soft);color:var(--pink)}
.tag.o{background:var(--ok-soft);color:var(--ok)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.b{background:var(--water-soft);color:var(--water)}
.tag.n{background:var(--surface-2);color:var(--ink-3)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;text-align:center;padding:7px 6px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:.14s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}

/* ---------- inputs ---------- */
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink-2);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 11px;
  font-size:14px;width:100%;font-family:var(--f-b);transition:.14s}
input:focus,select:focus,textarea:focus{border-color:var(--line-2);background:var(--surface)}
input[type=number]{font-family:var(--f-m)}
textarea{min-height:66px;resize:vertical}
.srch{position:relative}
.srch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--ink-3)}
.srch input{padding-left:34px}

/* ---------- tiles, barras, anéis ---------- */
.tile{background:var(--surface-2);border-radius:var(--r-s);padding:10px 11px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .k{font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:700;color:var(--ink-3)}
.tile .v{font-family:var(--f-m);font-size:19px;font-weight:600;letter-spacing:-.04em;line-height:1.25}
.tile .u{font-size:10.5px;color:var(--ink-2)}
.bar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--blue);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.ring .trk{fill:none;stroke:var(--surface-3);stroke-width:8}
.ring .val{fill:none;stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dasharray .7s cubic-bezier(.2,.8,.2,1)}

/* ---------- listas ---------- */
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);width:100%}
.li:last-child{border-bottom:0}
.li .ttl{font-size:13.8px;font-weight:600}
.li .sub{font-size:11.5px;color:var(--ink-2);margin-top:1px}
.chk{width:21px;height:21px;border-radius:7px;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;
  color:transparent;transition:.16s}
.chk .ic{font-size:12px;stroke-width:3}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ex{border:1px solid var(--line);border-radius:var(--r-s);padding:11px;background:var(--surface);width:100%}
.ex.done{background:var(--ok-soft);border-color:transparent}
.ex .nm{font-weight:600;font-size:14px;letter-spacing:-.01em}
.ex .meta{font-family:var(--f-m);font-size:11.5px;color:var(--ink-2);margin-top:2px}
.ex .obs{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.45}
.idx{width:25px;height:25px;border-radius:8px;background:var(--blue-soft);color:var(--blue);
  display:grid;place-items:center;font-family:var(--f-m);font-size:11.5px;font-weight:600;flex:none}
.idx.pk{background:var(--pink-soft);color:var(--pink)}
.sets{display:flex;gap:5px;flex-wrap:wrap}
.sets button{width:30px;height:30px;border-radius:9px;border:1.8px solid var(--line-2);background:var(--surface-2);
  display:grid;place-items:center;font-family:var(--f-m);font-size:11.5px;font-weight:600;color:var(--ink-3);transition:.14s}
.sets button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.empty{text-align:center;color:var(--ink-3);font-size:12.5px;padding:20px 12px;border:1px dashed var(--line-2);
  border-radius:var(--r-s);line-height:1.5}
.empty .ic{font-size:22px;display:block;margin:0 auto 8px;color:var(--line-2);stroke-width:1.4}
.vid{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:var(--r-s);
  background:var(--surface);width:100%;transition:.14s}
.vid:hover{border-color:var(--line-2);background:var(--surface-2)}
.vid .pl{width:34px;height:34px;border-radius:9px;background:var(--pink-soft);color:var(--pink);
  display:grid;place-items:center;flex:none;font-size:16px}
/* vídeo que toca na própria página */
.vcard{border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--surface)}
.vthumb{display:block;position:relative;width:100%;aspect-ratio:16/9;background:var(--surface-3);padding:0;border:0;cursor:pointer}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb:hover .vplay{transform:scale(1.08)}
.vplay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
  background:rgba(12,22,30,.74);color:#fff;display:grid;place-items:center;font-size:21px;transition:transform .15s;
  box-shadow:0 2px 14px rgba(0,0,0,.35)}
.vplay .ic{margin-left:3px}
.vframe{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.vtit{padding:9px 11px;font-size:13px;font-weight:600;line-height:1.35}
.movcard{display:block;width:100%;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;
  background:var(--surface);text-align:left;transition:.14s}
.movcard:hover{border-color:var(--line-2)}
.movthumb{display:block;position:relative;width:100%;aspect-ratio:16/9;background:var(--surface-3)}
.movthumb img{width:100%;height:100%;object-fit:cover;display:block}
.movnome{display:block;font-weight:600;font-size:13px;padding:8px 10px 0;line-height:1.3}
.movmusc{display:block;font-size:11px;color:var(--ink-2);padding:2px 10px 9px;line-height:1.3}
/* leitor de código de barras */
.scanwrap{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:var(--r-s);overflow:hidden}
.scanwrap video{width:100%;height:100%;object-fit:cover;display:block}
.scanmira{position:absolute;top:50%;left:12%;right:12%;height:2px;background:var(--pink);
  box-shadow:0 0 0 1px rgba(0,0,0,.4);opacity:.9}
.scanmira::before,.scanmira::after{content:"";position:absolute;top:-28px;bottom:-28px;width:2px;background:rgba(255,255,255,.55)}
.scanmira::before{left:0}.scanmira::after{right:0}

/* ---------- abas ---------- */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.subtabs::-webkit-scrollbar{display:none}
.subtab{white-space:nowrap;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);transition:.14s}
.subtab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:35;background:var(--surface);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);
  padding-left:var(--gl);padding-right:var(--gr);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:600;
  color:var(--ink-3);letter-spacing:.01em;position:relative;padding-top:4px;text-align:center}
nav.tabbar button .ic{font-size:20px}
nav.tabbar button.on{color:var(--pink)}
nav.tabbar button.on::before{content:"";position:absolute;top:-6px;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--pink)}

/* ---------- calendário ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:9.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.cday{aspect-ratio:1;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-family:var(--f-m);font-size:12px;border:1.5px solid transparent;min-width:0}
.cday .dot{width:6px;height:6px;border-radius:50%}
.cday.today{border-color:var(--pink);font-weight:700}
.cday.void{background:transparent}
.cday.sel{background:var(--ink);color:var(--bg)}
.cday.ok{box-shadow:inset 0 0 0 1.5px var(--ok)}

/* ---------- sheet / toast ---------- */
.ovl{position:fixed;inset:0;z-index:60;background:rgba(8,20,30,.6);display:flex;align-items:flex-end;
  justify-content:center;backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(22px)}to{transform:none}}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;
  padding-left:var(--gl);padding-right:var(--gr);padding-top:10px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:slide .26s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 10px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;position:sticky;top:0;
  background:var(--surface);padding-block:4px 9px;z-index:2}
.sh-h h3{font-size:17px}
.x{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:70;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:var(--sh-2);max-width:92vw;text-align:center;animation:up .22s}

/* ---------- gráficos ---------- */
.chartbox{overflow-x:auto;scrollbar-width:thin}
.chart text{font-family:var(--f-m);font-size:9px;fill:var(--ink-3)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--pink);stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round}
.timerbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom,0px));z-index:55;
  background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:14px;display:flex;align-items:center;gap:13px;
  box-shadow:var(--sh-2);animation:up .2s}
/* ---------- fotos ---------- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fcell{position:relative;aspect-ratio:3/4;border-radius:var(--r-s);overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.fcell img{width:100%;height:100%;object-fit:cover;display:block}
.fcell .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));
  color:#fff;font-size:10px;font-family:var(--f-m);padding:14px 6px 5px;text-align:center}
.fcell button.del{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:11px}
.demo .ctl{position:absolute;right:8px;bottom:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function higDoDia(d){
 const x=diaRO(d).hig||{};
 return HIG.filter(t=>{
  if((S.perfil.higOff||[]).indexOf(t.id)>=0)return false;
  if(t.freq<=1)return true;
  /* tarefas espaçadas: aparecem se já passou o intervalo desde a última vez */
  const ult=ultimaHig(t.id,d);
  return !ult||diffDias(ult,d)>=t.freq;
 }).map(t=>Object.assign({},t,{nivel:x[t.id]||0}));
}
function ultimaHig(id,ate){
 const ds=Object.keys(S.dias).filter(z=>z<=ate&&((S.dias[z].hig||{})[id]>0)).sort();
 return ds.length?ds[ds.length-1]:null;
}
function progHig(d){
 const l=higDoDia(d);
 return{f:l.filter(t=>t.nivel>0).length,t:l.length};
}

function ymd(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function parseYmd(s){const[a,b,c]=String(s).split('-').map(Number);return new Date(a,b-1,c)}
function hoje(){return ymd(new Date())}
function diffDias(a,b){return Math.round((parseYmd(b)-parseYmd(a))/864e5)}
function addDias(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)}
function fmtData(s){return parseYmd(s).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})}
function fmtCurto(s){return parseYmd(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}
function fmtLonga(s){const t=parseYmd(s).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
 return t.charAt(0).toUpperCase()+t.slice(1)}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nrm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim()}
function n1(v){return Math.round(v*10)/10}
function agoraMin(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function hm2min(h){const[a,b]=String(h).split(':').map(Number);return a*60+(b||0)}

/* =====================================================================
   FOTOS — ficam no IndexedDB deste navegador, que aguenta arquivos
   grandes. O texto do app fica no localStorage; só a imagem vem daqui.
   ===================================================================== */
const FOTO_DB='norte-fotos';
function fotoStore(modo){
 return new Promise((res,rej)=>{
  if(!window.indexedDB)return rej(new Error('sem indexedDB'));
  const req=indexedDB.open(FOTO_DB,1);
  req.onupgradeneeded=()=>{const b=req.result;if(!b.objectStoreNames.contains('f'))b.createObjectStore('f')};
  req.onsuccess=()=>{try{res(req.result.transaction('f',modo).objectStore('f'))}catch(e){rej(e)}};
  req.onerror=()=>rej(req.error);
 });
}
function fotoSalvar(id,blob){return fotoStore('readwrite').then(s=>new Promise((res,rej)=>{
 const q=s.put(blob,id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)}))}
function fotoLer(id){return fotoStore('readonly').then(s=>new Promise((res,rej)=>{
 const q=s.get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))}
function fotoApagar(id){return fotoStore('readwrite').then(s=>new Promise(res=>{
 const q=s.delete(id);q.onsuccess=()=>res();q.onerror=()=>res()})).catch(()=>{})}
/* troca os espaços reservados da galeria pelas imagens guardadas */
function hidratarFotos(){
 document.querySelectorAll('img[data-foto]').forEach(img=>{
  if(img.dataset.pronto)return;
  fotoLer(img.dataset.foto).then(b=>{
   if(b){img.src=URL.createObjectURL(b);img.dataset.pronto='1'}
  }).catch(()=>{});
 });
}

function diaPlano(d){return diffDias(S.perfil.inicio||hoje(),d||hoje())+1}
/* Na trilha de bem-estar o plano não escala para as fases pesadas:
   fica na base e na construção, onde o objetivo é constância. */
function faseDe(n){
 const f=PHASES.find(z=>n>=z.ini&&n<=z.fim)||PHASES[0];
 const teto=S.perfil.trilha==='bem'?2:4;
 return f.id>teto?PHASES[teto-1]:f;
}
function sessaoDe(d){
 const n=diaPlano(d);
 if(n<1)return{n,fase:PHASES[0],key:null,s:null,idx:0,semana:0};
 const fase=faseDe(n),idx=(n-fase.ini)%7,key=cicloDa(fase)[idx];
 return{n,fase,key,s:W[key],idx,semana:Math.floor((n-1)/7)+1};
}
/* Aplica as trocas que você escolheu: o exercício substituto herda séries e
   repetições do original. */
function exercicios(key){const s=W[key];if(!s)return[];
 const bruto=listaBase(key);
 return bruto.map(ex=>{const t=S.trocas[ex.n];return t?Object.assign({},ex,{n:t,trocado:ex.n}):ex});
}
function listaBase(key){const s=W[key];if(!s)return[];
 const L=S.perfil.local;
 return L==='academia'?s.gym:L==='cal'?(s.cal||s.home):s.home}
function localInfo(){return LOCAIS.find(l=>l[0]===S.perfil.local)||LOCAIS[0]}
function corTipo(t){return t==='treino'?'var(--pink)':t==='ativo'?'var(--ok)':'var(--warn)'}
/* A cada 8 semanas entra uma semana mais leve, para o corpo recuperar. */
function ehDeload(semana){return semana>0&&semana%8===0}
function nSeries(ex,semana){
 const v=parseInt(ex.s);let n=isNaN(v)?1:Math.min(v,6);
 if(semana&&ehDeload(semana)&&n>2)n--;
 return n;
}
function setsFeitos(d,key,i){return (diaRO(d).treino.sets||{})[key+':'+i]||0}
function exOk(d,key,i,ex,semana){return setsFeitos(d,key,i)>=nSeries(ex,semana)}
function progTreino(d){
 const se=sessaoDe(d);if(!se.s)return{f:0,t:0};
 const exs=exercicios(se.key);
 return{f:exs.filter((ex,i)=>exOk(d,se.key,i,ex,se.semana)).length,t:exs.length};
}
function e1rm(kg,reps){return Math.round(kg*(1+reps/30))}

function pesoAtual(){return S.pesos.length?S.pesos[S.pesos.length-1].v:S.perfil.peso}
function metas(d){
 const p=S.perfil,peso=pesoAtual();
 const tmb=10*peso+6.25*p.altura-5*p.idade+(p.sexo==='m'?5:-161);
 const gasto=tmb*p.ativ;
 let kcal=Math.round((p.obj==='perder'?gasto*.8:p.obj==='ganhar'?gasto*1.15:gasto)/10)*10;
 /* piso de segurança: a meta nunca fica abaixo do gasto em repouso */
 if(kcal<tmb*1.05)kcal=Math.round(tmb*1.05/10)*10;
 /* Proteína: meta-análises colocam o ponto de virada perto de 1,6 g/kg para
    quem treina. Em déficit calórico sobe, porque protege a massa magra. */
 let prot=Math.round(peso*(p.obj==='perder'?2.2:1.8));
 let gord=Math.round(peso*.9);
 let carb=Math.max(40,Math.round((kcal-prot*4-gord*9)/4));
 const treinou=((sessaoDe(d||hoje()).s||{}).tipo==='treino');
 let agua=Math.round((peso*35+(treinou?500:0))/50)*50;
 const m=p.manual;
 if(m){if(m.kcal)kcal=m.kcal;if(m.prot)prot=m.prot;if(m.carb)carb=m.carb;if(m.gord)gord=m.gord;if(m.agua)agua=m.agua}
 return{tmb:Math.round(tmb),gasto:Math.round(gasto),kcal,prot,carb,gord,agua,manual:!!m};
}
/* Gasto calórico medido pelos seus próprios dados, não pela fórmula.
   Se você comeu X por dia e o peso mudou Y, o gasto real sai dessa conta.
   Vale mais que qualquer estimativa — mas só depois de algumas semanas. */
function tdeeReal(){
 const d0=addDias(hoje(),-34);
 const dias=Object.keys(S.dias).filter(d=>d>=d0&&d<=hoje()).sort();
 /* só dias razoavelmente completos entram na média: um dia em que você
    registrou só o café puxa o resultado para baixo e estraga a conta */
 const comReg=dias.filter(d=>{
  const ref=S.dias[d].ref||{};
  const slots=MEALS.filter(m=>(ref[m.k]||[]).length).length;
  return slots>=3||totalDia(d).kcal>=metas().kcal*0.6;
 });
 const ps=S.pesos.filter(p=>p.d>=d0).sort((a,b)=>a.d<b.d?-1:1);
 if(comReg.length<10)return{faltam:'registre o dia inteiro em pelo menos 10 dias (contei '+comReg.length+
  '; dias com só uma ou duas refeições não entram, porque distorceriam a média)'};
 if(ps.length<2)return{faltam:'registre o peso pelo menos duas vezes'};
 const span=diffDias(ps[0].d,ps[ps.length-1].d);
 if(span<10)return{faltam:'as pesagens precisam estar a 10 dias ou mais de distância'};
 const mediaKcal=comReg.reduce((a,d)=>a+totalDia(d).kcal,0)/comReg.length;
 const deltaKg=ps[ps.length-1].v-ps[0].v;
 const tdee=mediaKcal-(deltaKg*7700/span);
 if(!isFinite(tdee)||tdee<800||tdee>6000)return{faltam:'os números ainda estão inconsistentes demais'};
 const o=S.perfil.obj;
 const alvo=o==='perder'?tdee*0.8:o==='ganhar'?tdee*1.15:tdee;
 return{dias:comReg.length,span,mediaKcal:Math.round(mediaKcal),deltaKg:n1(deltaKg),
  tdee:Math.round(tdee/10)*10,sugerido:Math.round(alvo/10)*10,atual:metas().kcal};
}
/* Estimativa de gordura corporal pelo método das circunferências (US Navy). */
function gorduraCorporal(){
 const ms=S.medidas.slice().sort((a,b)=>a.d<b.d?-1:1);
 const m=ms[ms.length-1];
 if(!m)return null;
 const alt=S.perfil.altura,masc=S.perfil.sexo==='m',L=Math.log10;
 if(!m.cintura||!m.pescoco||!alt)return{faltam:true,d:m.d};
 let pct;
 if(masc)pct=495/(1.0324-0.19077*L(m.cintura-m.pescoco)+0.15456*L(alt))-450;
 else{if(!m.quadril)return{faltam:true,d:m.d};
  pct=495/(1.29579-0.35004*L(m.cintura+m.quadril-m.pescoco)+0.22100*L(alt))-450}
 if(!isFinite(pct)||pct<3||pct>70)return{faltam:true,d:m.d};
 const peso=pesoAtual();
 return{pct:n1(pct),d:m.d,gordura:n1(peso*pct/100),magra:n1(peso*(1-pct/100))};
}
/* Média móvel: a linha que mostra a tendência em vez do sobe e desce diário. */
function mediaMovel(pts,janela){
 janela=janela||7;
 return pts.map((p,i)=>{
  const ini=Math.max(0,i-janela+1),fatia=pts.slice(ini,i+1);
  return{x:p.x,y:fatia.reduce((a,z)=>a+z.y,0)/fatia.length};
 });
}
function totalRef(d,k){const it=((diaRO(d).ref||{})[k]||[]);
 return it.reduce((a,x)=>({kcal:a.kcal+(x.kcal||0),p:a.p+(x.p||0),c:a.c+(x.c||0),g:a.g+(x.g||0)}),{kcal:0,p:0,c:0,g:0})}
function totalDia(d){return MEALS.reduce((a,m)=>{const t=totalRef(d,m.k);
 return{kcal:a.kcal+t.kcal,p:a.p+t.p,c:a.c+t.c,g:a.g+t.g}},{kcal:0,p:0,c:0,g:0})}
function addItem(d,k,item,silencio){
 const x=dia(d);x.ref[k]=x.ref[k]||[];x.ref[k].push(item);
 S.recentes=[item,...S.recentes.filter(r=>r.n!==item.n)].slice(0,14);
 save('dia',d);save('base');
 if(!silencio){render();toast('Registrado em '+MEALS.find(m=>m.k===k).n)}
}
function pontuar(r){
 const des=S.despensa.map(nrm).filter(Boolean);
 if(!des.length)return null;
 let tem=0;const faltantes=[];
 r.ing.forEach(ing=>{const k=nrm(ing.k),nm=nrm(ing.n);
  if(des.some(d=>k.includes(d)||d.includes(k)||nm.includes(d)))tem++;else faltantes.push(ing.n)});
 return{tem,falta:r.ing.length-tem,pct:Math.round(tem/r.ing.length*100),faltantes};
}
function gerarCardapio(semente){
 const m=metas(),out={};
 const sem=semente||Math.floor(Math.random()*9999);
 MEALS.forEach((ref,ri)=>{
  const alvo=m.kcal*ref.pct;
  let cand=RECIPES.filter(r=>r.ref.includes(ref.k));
  if(!cand.length)cand=RECIPES;
  const scored=cand.map(r=>{const p=pontuar(r);
   return{r,s:Math.abs(r.kcal-alvo)/alvo-(p?p.pct/260:0)-(S.favs.includes(r.id)?.15:0)}})
   .sort((a,b)=>a.s-b.s);
  const janela=scored.slice(0,Math.min(4,scored.length));
  out[ref.k]=janela[(sem+ri*3)%janela.length].r.id;
 });
 return{sem,itens:out};
}

    (t.kcal?' · registrado '+Math.round(t.kcal):'')});
 });
 if(se.s)it.push({h:p.horaTreino||'18:00',n:se.s.nome,ic:'dumb',tipo:'treino',
  ok:!!x.treino.feito,act:'go',v:'treino',
  sub:(se.s.tipo==='off'?'Dia de descanso — checklist curto':se.s.foco+' · '+localInfo()[1].toLowerCase())});
 if(p.vozAlvo!=='off')it.push({h:somaMin(p.horaTreino||'18:00',150),n:'Treino de voz — '+vz.bloco.t,ic:'mic',tipo:'voz',
  ok:!!x.voz.feito,act:'go-sub',v:'cuidados|voz',sub:vz.min+' minutos · '+vz.exs.length+' exercícios'});
 if(S.perfil.trilha!=='bem')
 it.push({h:somaMin(p.dormir||'23:00',-60),n:'Skincare da noite',ic:'moon',tipo:'pele',
  ok:!!x.pele.noite,act:'pele',v:'noite',sub:passosPele('noite').length+' passos · um ativo por noite, nunca dois'});
 it.push({h:p.dormir||'23:00',n:'Dormir',ic:'moon',tipo:'sono',ok:(x.sono||0)>=7,act:'go',v:'inicio',
  sub:'Meta de 7 a 9 horas — é quando o músculo cresce e a pele se repara'});
 return it.sort((a,b)=>hm2min(a.h)-hm2min(b.h));
}
function somaMin(h,min){

 return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');

/* ---------- gráficos ---------- */
function lineChart(pts,unid,cor,media){
 if(pts.length<2)return vazio('chart','Registre pelo menos duas medições para o gráfico aparecer.');
 cor=cor||'var(--pink)';
 const W=560,H=172,L=40,R=14,T=14,B=26;
 const ys=pts.map(p=>p.y),mn=Math.min(...ys),mx=Math.max(...ys),pad=(mx-mn)||Math.max(1,mx*.05);
 const lo=mn-pad*.3,hi=mx+pad*.3;
 const X=i=>L+i*(W-L-R)/(pts.length-1),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
 let g='',lbl='';
 for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3,y=Y(v);
  g+='<line class="gl" x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'"/>'+
   '<text x="'+(L-7)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+n1(v)+'</text>';}
 const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
 const area=d+' L'+X(pts.length-1).toFixed(1)+' '+(H-B)+' L'+L+' '+(H-B)+' Z';
 const step=Math.ceil(pts.length/6);
 pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1)
  lbl+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.x)+'</text>'});
 const dots=pts.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(i===pts.length-1?4.2:2.4)+'" fill="'+cor+'"/>').join('');

  '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+

  (media&&media.length===pts.length?'<path d="'+media.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ')+
   '" fill="none" stroke="var(--ink-3)" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round"/>':'')+
  dots+lbl+'</svg></div>';

function barChart(pts,meta,cor){
 if(!pts.length)return vazio('chart','Sem dados no período.');
 cor=cor||'var(--blue)';
 const W=560,H=152,L=40,R=14,T=12,B=24;
 const mx=Math.max(meta||0,...pts.map(p=>p.y),1)*1.14;
 const bw=(W-L-R)/pts.length,Y=v=>T+(1-v/mx)*(H-T-B);
 let s='';
 for(let i=0;i<3;i++){const v=mx*i/2,y=Y(v);
  s+='<line class="gl" x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'"/>'+
   '<text x="'+(L-7)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+Math.round(v)+'</text>';}
 pts.forEach((p,i)=>{const h=Math.max(0,(H-B)-Y(p.y));
  s+='<rect x="'+(L+i*bw+bw*.17).toFixed(1)+'" y="'+Y(p.y).toFixed(1)+'" width="'+(bw*.66).toFixed(1)+
   '" height="'+h.toFixed(1)+'" rx="3" fill="'+(p.y?cor:'var(--line)')+'"/>'+
   '<text x="'+(L+i*bw+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+esc(p.x)+'</text>';});
 if(meta){const y=Y(meta);s+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+
  '" stroke="var(--pink)" stroke-width="1.6" stroke-dasharray="5 4"/>'}
 return '<div class="chartbox"><svg class="chart" viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:290px;height:auto">'+s+'</svg></div>';
}
function hBars(pts,cor){

 const mx=Math.max(...pts.map(p=>p.y),1);

  '<div><div class="row spread tiny" style="margin-bottom:3px"><span style="font-weight:600">'+esc(p.x)+'</span>'+
  '<span class="num muted">'+p.y+' séries</span></div>'+barra(p.y,mx,cor||'var(--blue)')+'</div>').join('')+'</div>';
}

function streak(){
 const vivo=z=>{const x=S.dias[z];return !!(x&&(((x.treino||{}).feito)||(x.agua||0)>0||((x.voz||{}).feito)||
  ((x.pele||{}).manha)||MEALS.some(m=>((x.ref||{})[m.k]||[]).length)))};
 let n=0,d=hoje();
 if(!vivo(d))d=addDias(d,-1);
 for(let i=0;i<400;i++){if(vivo(d))n++;else break;d=addDias(d,-1)}
 return n;
}

/* =====================================================================
   CÓDIGO DE BARRAS
   A câmera lê o código e os valores vêm da Open Food Facts, uma base
   aberta e colaborativa de produtos. Se o navegador não souber ler
   código, dá para digitar os números na mão.
   ===================================================================== */
let scanStream=null,scanLoop=null,ultimoScan=null;
function pararCamera(){
 if(scanLoop){clearInterval(scanLoop);scanLoop=null}
 if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
}
function sheetScan(){
 const temLeitor=(typeof window.BarcodeDetector!=='undefined');
 sheet('Código de barras',
  (temLeitor?'<div class="scanwrap"><video id="scanVid" playsinline muted autoplay></video><div class="scanmira"></div></div>'+
    '<p class="xtiny muted" style="margin:9px 0 13px;text-align:center">Aponte a câmera para o código de barras da embalagem.</p>'
   :'<p class="tiny muted" style="margin-bottom:12px">Este navegador não lê código pela câmera. '+
     'Digite os números que ficam embaixo das barras.</p>')+
  '<div class="row" style="gap:7px"><input type="number" inputmode="numeric" id="codIn" placeholder="7891234567890" class="grow">'+
  '<button class="btn sm" data-a="buscar-cod">Buscar</button></div>'+
  '<div id="scanRes" style="margin-top:14px"></div>','Produtos de embalagem');
 if(temLeitor)iniciarCamera();
}
function iniciarCamera(){
 const v=$('#scanVid');if(!v)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return avisoCamera();
 navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(st=>{
  if(!$('#scanVid')){st.getTracks().forEach(t=>t.stop());return}
  scanStream=st;v.srcObject=st;v.play().catch(()=>{});
  const det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
  scanLoop=setInterval(()=>{
   const vid=$('#scanVid');
   if(!vid)return pararCamera();
   det.detect(vid).then(cods=>{
    if(cods&&cods.length){pararCamera();buscarCodigo(cods[0].rawValue)}
   }).catch(()=>{});
  },700);
 }).catch(avisoCamera);
}
function avisoCamera(){
 const w=document.querySelector('.scanwrap');
 if(w)w.outerHTML='<p class="tiny" style="color:var(--warn);margin-bottom:12px">'+
  'Não consegui abrir a câmera. Digite o número do código abaixo.</p>';
}
function buscarCodigo(cod){
 const res=$('#scanRes');if(!res)return;
 cod=String(cod||'').replace(/\D/g,'');
 if(cod.length<8){res.innerHTML='<p class="tiny" style="color:var(--warn)">Código curto demais.</p>';return}
 res.innerHTML='<p class="tiny muted">Procurando '+esc(cod)+'…</p>';
 fetch('https://world.openfoodfacts.org/api/v2/product/'+cod+
   '.json?fields=product_name,product_name_pt,brands,nutriments')
  .then(r=>r.json())
  .then(j=>{
   const p=j&&j.product;
   if(!j||j.status!==1||!p)throw new Error('sem produto');
   const n=p.nutriments||{};
   let kcal=Number(n['energy-kcal_100g']);
   if(!kcal&&n.energy_100g)kcal=Number(n.energy_100g)/4.184;
   if(!kcal||!isFinite(kcal))throw new Error('sem valores');
   const nome=[(p.product_name_pt||p.product_name||'').trim(),(p.brands||'').split(',')[0].trim()]
    .filter(Boolean).join(' — ').slice(0,70)||('Produto '+cod);
   ultimoScan={n:nome,kcal:Math.round(kcal),p:Number(n.proteins_100g)||0,
    c:Number(n.carbohydrates_100g)||0,g:Number(n.fat_100g)||0};
   if(!$('#scanRes'))return;
   $('#scanRes').innerHTML='<div class="ex"><div class="nm">'+esc(ultimoScan.n)+'</div>'+
    '<div class="meta">'+ultimoScan.kcal+' kcal · P '+n1(ultimoScan.p)+' C '+n1(ultimoScan.c)+
    ' G '+n1(ultimoScan.g)+' por 100 g</div>'+
    '<div class="row" style="gap:7px;margin-top:11px">'+
    '<input type="number" inputmode="numeric" id="scanG" value="100" class="grow">'+
    '<button class="btn acc" data-a="add-scan">Registrar</button></div>'+
    '<p class="xtiny muted" style="margin-top:8px">Valores da base aberta Open Food Facts. '+
    'Confira no rótulo se parecer estranho.</p></div>';
  })
  .catch(()=>{
   if(!$('#scanRes'))return;
   $('#scanRes').innerHTML='<p class="tiny" style="color:var(--warn)">Não achei esse produto na base aberta. '+
    'Use a aba Manual e copie os valores do rótulo da embalagem.</p>';
  });
}

/* Estimativa de gordura corporal a partir das circunferências. */
/* Metas para um peso qualquer — serve para mostrar o que mudou desde
   a pesagem anterior, já que tudo é recalculado sozinho. */
function metasDoPeso(peso){
 const p=S.perfil;
 const tmb=10*peso+6.25*p.altura-5*p.idade+(p.sexo==='m'?5:-161);
 const gasto=tmb*p.ativ;
 let kcal=Math.round((p.obj==='perder'?gasto*.8:p.obj==='ganhar'?gasto*1.15:gasto)/10)*10;
 if(kcal<tmb*1.05)kcal=Math.round(tmb*1.05/10)*10;
 return{kcal,prot:Math.round(peso*(p.obj==='perder'?2.2:1.8)),
  agua:Math.round(peso*35/50)*50,tmb:Math.round(tmb)};
}
function blocoRecalculo(){
 const ps=S.pesos.slice().sort((a,b)=>a.d<b.d?-1:1);
 if(ps.length<2)return '';
 const atual=ps[ps.length-1];
 const antes=ps.filter(p=>diffDias(p.d,atual.d)<=45)[0];
 if(!antes||antes.d===atual.d)return '';
 const a=metasDoPeso(antes.v),b=metasDoPeso(atual.v);
 const mudou=(a.kcal!==b.kcal)||(a.prot!==b.prot)||(a.agua!==b.agua);
 const med=S.medidas.slice().sort((x,y)=>x.d<y.d?-1:1);
 const m0=med[0],m1=med[med.length-1];
 const difMed=(m0&&m1&&m0!==m1)?CAMPOS.filter(([k])=>m0[k]&&m1[k]&&Math.abs(m1[k]-m0[k])>=0.5)
  .map(([k,n])=>n+' '+(m1[k]-m0[k]>0?'+':'')+n1(m1[k]-m0[k])):[];
 return '<div class="card">'+chTtl('redo','O que mudou com a sua evolução')+
  '<p class="tiny muted" style="margin-bottom:11px">Tudo no app é recalculado a partir do seu peso atual. '+
  'Comparando <b>'+fmtCurto(antes.d)+'</b> com <b>'+fmtCurto(atual.d)+'</b>:</p>'+
  '<div class="stack" style="gap:0">'+
  [['Peso',n1(antes.v)+' kg',n1(atual.v)+' kg'],
   ['Meta de calorias',a.kcal+' kcal',b.kcal+' kcal'],
   ['Meta de proteína',a.prot+' g',b.prot+' g'],
   ['Meta de água',(a.agua/1000).toFixed(1)+' L',(b.agua/1000).toFixed(1)+' L'],
   ['Gasto em repouso',a.tmb+' kcal',b.tmb+' kcal']].map(([n,x,y])=>
   '<div class="li"><div class="grow"><div class="ttl">'+n+'</div></div>'+
   '<div class="num tiny muted">'+x+'</div>'+ic('right','color:var(--ink-3);font-size:13px')+
   '<div class="num tiny" style="font-weight:600">'+y+'</div></div>').join('')+'</div>'+
  (difMed.length?'<p class="tiny" style="margin-top:11px;color:var(--ok)">Nas medidas: '+esc(difMed.join(' · '))+' cm.</p>':'')+
  '<p class="xtiny muted" style="margin-top:10px;line-height:1.6">'+
  (mudou?'As metas acima já estão valendo — você não precisa ajustar nada na mão.'
   :'A variação foi pequena demais para mexer nas metas.')+
  (S.perfil.thIni?' Em hormonização, peso parado pode significar gordura saindo e músculo entrando ao mesmo tempo: '+
   'é por isso que medida e foto contam mais que a balança aqui.':'')+'</p></div>';
}
/* A proporção que importa depende da trilha: ombro sobre cintura descreve
   a leitura masculina; cintura sobre quadril, a feminina. Na trilha de
   bem-estar não existe alvo estético nenhum — só o número. */
function proporcaoDaTrilha(m){
 if(!m)return '';
 const t=S.perfil.trilha;
 if(t==='masc'&&m.ombro&&m.cintura){
  const v=n1(m.ombro/m.cintura);
  return '<p class="tiny muted" style="margin-top:10px">Ombro ÷ cintura: <b class="num">'+v+'</b>. '+
   'É a proporção que mais descreve a leitura masculina do corpo — referência entre 1,4 e 1,6. '+
   'Dá para subir dos dois lados: ganhando ombro e dorsal, e segurando a cintura.</p>';
 }
 if(t==='fem'&&m.cintura&&m.quadril){
  const v=n1(m.cintura/m.quadril);
  return '<p class="tiny muted" style="margin-top:10px">Cintura ÷ quadril: <b class="num">'+v+'</b>. '+
   'É a proporção que mais descreve a leitura feminina do corpo — referência entre 0,7 e 0,8. '+
   'Treino de glúteo e perna mexe no denominador; cintura firme, sem engrossar os oblíquos, mexe no numerador.</p>';
 }
 if(t==='bem')return '<p class="xtiny muted" style="margin-top:10px">Aqui as medidas servem só para você acompanhar '+
  'o próprio corpo ao longo do tempo. Não há número certo nem meta estética.</p>';
 const falta=t==='fem'?'cintura e quadril':'ombro e cintura';
 return '<p class="xtiny muted" style="margin-top:10px">Registre '+falta+' na mesma medição para ver a proporção.</p>';
}

function leitura(ades,k,p,m,ps,vozes){
 const t=[];
 if(!k)t.push('Ainda não há refeições registradas suficientes para uma análise. Registre pelo menos uma semana completa para os números fazerem sentido.');
 else{
  if(k>m.kcal*1.08)t.push('Sua média calórica está cerca de '+Math.round(k-m.kcal)+' kcal por dia acima da meta — o equivalente a aproximadamente '+n1((k-m.kcal)*30/7700)+' kg de gordura por mês.');
  else if(k<m.kcal*.85)t.push('Sua média está bem abaixo da meta. Déficit grande demais derruba o rendimento no treino e faz perder massa muscular junto com a gordura.');
  else t.push('Sua média calórica está dentro da faixa da meta, que é exatamente onde o resultado aparece de forma consistente.');
  if(p<m.prot*.85)t.push('A proteína está abaixo do alvo: faltam cerca de '+Math.round(m.prot-p)+' g por dia. Uma fonte proteica a mais no lanche da tarde resolve.');
  else t.push('A proteína está no alvo, que é o fator que mais protege a massa muscular.');
 }
 if(ades>=80)t.push('A adesão ao treino está ótima — constância vale mais que intensidade.');
 else if(ades>0)t.push('A adesão ao treino está em '+ades+'%. Se a rotina apertou, troque a academia por casa ou calistenia: os três estão montados no app.');
 if(vozes>=20)t.push('O treino de voz está muito constante, e constância é justamente o que faz a voz mudar.');
 else if(vozes>0)t.push('Foram '+vozes+' dias de treino de voz no período. Dez minutos por dia rendem mais que uma hora no fim de semana.');
 if(ps&&ps.length>1){const d=n1(ps[ps.length-1].v-ps[0].v);
  t.push('No período o peso variou '+(d>0?'+':'')+d+' kg.');}
 return t.join(' ');
}

  if(s<=0){clearInterval(timerInt);

    '<button data-a="timer-stop" aria-label="Fechar">'+ic('x')+'</button>';
   if(navigator.vibrate)try{navigator.vibrate([180,90,180])}catch(e){}
   setTimeout(()=>{const x=$('#timerBar');if(x)x.remove()},5000);return}
  const mm=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');
  el.innerHTML='<span class="num" style="font-size:20px;font-weight:600">'+mm+':'+ss+'</span>'+
   '<span class="xtiny" style="opacity:.7">descanso</span>'+
   '<button data-a="timer-mais" style="font-size:12px;font-weight:700;opacity:.85">+30s</button>'+
   '<button data-a="timer-stop" aria-label="Parar">'+ic('x')+'</button>';

 };
 tick();timerInt=setInterval(tick,1000);

function copiar(txt,msg){
 const fb=()=>sheet('Copie o texto','<textarea style="min-height:240px">'+esc(txt)+'</textarea>');
 try{navigator.clipboard.writeText(txt).then(()=>toast(msg),fb)}catch(e){fb()}

/* Planilha com um dia por linha, separada por ponto e vírgula, que é o que
   o Excel em português espera. O BOM no começo preserva os acentos. */
function baixarCSV(){
 const cab=['data','kcal','proteina_g','carboidrato_g','gordura_g','agua_ml','peso_kg',
  'treino','sono_h','passos','voz','pele_manha','pele_noite'];
 const pesoDe={};S.pesos.forEach(p=>{pesoDe[p.d]=p.v});
 const linhas=[cab];
 Object.keys(S.dias).sort().forEach(d=>{
  const x=S.dias[d],t=totalDia(d);
  linhas.push([d,Math.round(t.kcal),n1(t.p),n1(t.c),n1(t.g),x.agua||0,pesoDe[d]||'',
   (x.treino||{}).feito?'sim':'nao',x.sono||'',x.passos||'',
   (x.voz||{}).feito?'sim':'nao',(x.pele||{}).manha?'sim':'nao',(x.pele||{}).noite?'sim':'nao']);
 });
 if(linhas.length<2)return toast('Ainda não há dias registrados');
 const csv=linhas.map(l=>l.join(';')).join('\r\n');
 try{
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='rota-trans-'+hoje()+'.csv';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
  toast((linhas.length-1)+' dias na planilha');
 }catch(e){copiar(csv,'Planilha copiada')}
}

   if($('#sheetBox'))closeSheet();render();break}
  case 'repetir':{const ont=((diaRO(addDias(df,-1)).ref||{})[d.m]||[]);
   if(!ont.length)return toast('Nada registrado ontem');
   ont.forEach(z=>addItem(df,d.m,{...z},true));render();toast(ont.length+' itens copiados de ontem');break}
  case 'filtro-ref':S.ui.filtroRef=d.v;render();break;
  case 'novo-cardapio':S.ui.cardapio=gerarCardapio(Math.floor(Math.random()*9999));render();toast('Novo cardápio');break;
  case 'trocar-ref':sheetTrocar(d.m);break;
  case 'escolher-ref':S.ui.cardapio.itens[d.m]=d.id;closeSheet();render();break;
  case 'registrar-cardapio':{let n=0;
   MEALS.forEach(ref=>{const r=RECIPES.find(z=>z.id===S.ui.cardapio.itens[ref.k]);
    if(r&&!(xf.ref[ref.k]||[]).length){addItem(df,ref.k,{n:r.nome,q:r.rende,kcal:r.kcal,p:r.p,c:r.c,g:r.g},true);n++}});
   render();toast(n?n+' refeições registradas':'As refeições de hoje já estão preenchidas');break}

  /* despensa e compras */
  case 'desp-add':{const inp=$('#despIn'),v=inp.value.trim();
   if(v){v.split(/[,;]/).map(z=>z.trim()).filter(Boolean).forEach(z=>{
    if(!S.despensa.map(nrm).includes(nrm(z)))S.despensa.push(z)});inp.value='';save('base');render()}break}
  case 'desp-tog':{const i2=S.despensa.map(nrm).indexOf(nrm(d.v));
   if(i2>=0)S.despensa.splice(i2,1);else S.despensa.push(d.v);save('base');render();break}
  case 'desp-rm':S.despensa.splice(Number(d.i),1);save('base');render();break;
  case 'desp-limpa':S.despensa=[];save('base');render();break;
  case 'add-compras':{const itens=String(d.v).split('|').filter(Boolean);let n=0;
   itens.forEach(t=>{if(!S.compras.some(c=>nrm(c.t)===nrm(t))){S.compras.push({t,ok:false});n++}});
   save('base');closeSheet();toast(n+' itens na lista de compras');render();break}
  case 'comp-add':{const inp=$('#compIn'),v=inp.value.trim();
   if(v){S.compras.push({t:v,ok:false});inp.value='';save('base');render()}break}
  case 'comp-tog':S.compras[Number(d.i)].ok=!S.compras[Number(d.i)].ok;save('base');render();break;
  case 'comp-rm':S.compras.splice(Number(d.i),1);save('base');render();break;
  case 'compras-limpa':S.compras=S.compras.filter(c=>!c.ok);save('base');render();toast('Marcados removidos');break;
  case 'copiar-compras':copiar(S.compras.filter(c=>!c.ok).map(c=>'- '+c.t).join('\n'),'Lista copiada');break;

  /* progresso */
  case 'add-peso':{const v=Number($('#pesoIn').value);if(!v)return toast('Digite o peso');
   S.pesos=S.pesos.filter(p=>p.d!==hj);S.pesos.push({d:hj,v});S.pesos.sort((a2,b2)=>a2.d<b2.d?-1:1);
   S.perfil.peso=v;save('base');render();toast('Peso registrado');break}
  case 'rm-peso':S.pesos=S.pesos.filter(p=>p.d!==d.d);save('base');render();break;
  case 'med-sel':S.ui.medSel=d.v;render();break;
  case 'add-medida':{const m2={d:hj};let tem=false;
   CAMPOS.forEach(([k])=>{const el2=$('#md_'+k),v=Number(el2&&el2.value);if(v){m2[k]=v;tem=true}});
   if(!tem)return toast('Preencha pelo menos uma medida');
   S.medidas=S.medidas.filter(z=>z.d!==hj);S.medidas.push(m2);S.medidas.sort((a2,b2)=>a2.d<b2.d?-1:1);
   save('base');render();toast('Medição salva');break}
  case 'rm-medida':S.medidas=S.medidas.filter(z=>z.d!==d.d);save('base');render();break;
  case 'foto-del':{S.fotos=S.fotos.filter(f=>f.id!==d.id);fotoApagar(d.id);save();render();toast('Foto removida');break}
  case 'copiar-resumo':copiar(($('#leituraTxt')||{}).textContent||'','Resumo copiado');break;

  /* dados */
  case 'exportar':copiar(JSON.stringify({v:3,perfil:S.perfil,pesos:S.pesos,medidas:S.medidas,
   cargas:S.cargas,vozLog:S.vozLog,despensa:S.despensa,compras:S.compras,favs:S.favs,
   recentes:S.recentes,fotos:S.fotos,dias:S.dias},null,1),'Dados copiados');break;
  case 'importar':sheet('Importar dados',
   '<p class="tiny muted" style="margin-bottom:11px">Cole aqui o texto que você copiou no botão <b>Copiar meus dados</b>, '+
   'em outro navegador ou na outra versão do app. O que já está aqui é mantido; o que vier no texto entra por cima.</p>'+
   '<textarea id="impTxt" placeholder="Cole o texto aqui" style="min-height:190px;font-family:var(--f-m);font-size:11px"></textarea>'+
   '<button class="btn acc bl" style="margin-top:11px" data-a="importar-ok">Importar</button>','Trazer dados de outro lugar');break;
  case 'importar-ok':{
   let o;try{o=JSON.parse(($('#impTxt')||{}).value||'')}catch(e){return toast('Não consegui ler esse texto')}
   if(!o||typeof o!=='object')return toast('Texto inválido');
   if(o.perfil)S.perfil={...S.perfil,...o.perfil};
   ['pesos','medidas','vozLog','despensa','compras','favs','recentes','fotos'].forEach(k=>{
    if(Array.isArray(o[k]))S[k]=o[k]});
   if(o.cargas)S.cargas={...S.cargas,...o.cargas};
   let nd=0;
   if(o.dias&&typeof o.dias==='object')Object.keys(o.dias).forEach(dd=>{
    if(/^\d{4}-\d{2}-\d{2}$/.test(dd)){S.dias[dd]=o.dias[dd];save('dia',dd);nd++}});
   save('base');closeSheet();render();
   toast('Importado: '+nd+' dias de registro');break}
  case 'zerar-dia':{S.dias[hj]={d:hj,ref:{},agua:0,treino:{feito:false,sets:{}},voz:{feito:false,min:0,ex:{}},
   pele:{manha:false,noite:false},hab:{},sono:0,passos:0,humor:0,nota:''};
   save('dia',hj);render();toast('Dia de hoje zerado');break}
 }
});

document.addEventListener('change',ev=>{
 const kg=ev.target.closest('[data-a="kg"]');
 if(kg){const nome=kg.dataset.n,v=Number(kg.value);if(!v)return;
  const reps=parseInt(kg.dataset.r)||10;
  S.cargas[nome]=(S.cargas[nome]||[]).filter(r=>r.d!==hoje());
  S.cargas[nome].push({d:hoje(),kg:v,reps});
  save('base');toast('Carga anotada: '+v+' kg');return}
 const dn=ev.target.closest('[data-a="dia-num"]');
 if(dn){const x=dia(hoje());x[dn.dataset.f]=Number(dn.value)||0;
  if(dn.dataset.f==='sono'&&x.sono>=7)x.hab.sono=true;
  if(dn.dataset.f==='passos'&&x.passos>=8000)x.hab.passos=true;
  save('dia',hoje());return}
});
document.addEventListener('click',ev=>{
 const b=ev.target.closest('.subtab[data-st]');if(!b)return;
 const mapa={treinoTabs:'treino',nutriTabs:'nutri',progTabs:'prog',cuidTabs:'cuidados'};
 const g=mapa[(b.parentElement||{}).id];
 if(g){S.ui.sub[g]=b.dataset.st;window.scrollTo(0,0);render()}
});
document.addEventListener('click',ev=>{
 const b=ev.target.closest('#tabbar button[data-tab]');if(!b)return;
 S.ui.tab=b.dataset.tab;window.scrollTo(0,0);render();
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape')closeSheet();
 if(ev.key!=='Enter')return;
 const map={despIn:'desp-add',pesoIn:'add-peso',compIn:'comp-add',lembIn:'lemb-add',hzIn:'add-voz',minIn:'add-voz'};
 const act=map[ev.target.id];
 if(act){ev.preventDefault();const b=document.querySelector('[data-a="'+act+'"]');if(b)b.click()}
});

/* =====================================================================
   INÍCIO
   ===================================================================== */
lsLoad();
/* garante que as listas novas existam e sejam próprias deste estado,
   mesmo em dados salvos por uma versão anterior */
S.salvos=Array.isArray(S.salvos)?S.salvos.slice():[];
S.trocas=(S.trocas&&typeof S.trocas==='object')?Object.assign({},S.trocas):{};
S.th=Object.assign({freq:14,hist:[]},S.th||{});
S.th.hist=Array.isArray(S.th.hist)?S.th.hist.slice():[];
if(!S.perfil.inicio)S.perfil.inicio=hoje();
migrar();
aplicaTema();
render();
setInterval(()=>{if(S.ui.tab==='inicio'&&!$('#sheetBox'))renderInicio()},60000);
</script>
</body>
</html>

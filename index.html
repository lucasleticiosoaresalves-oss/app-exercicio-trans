/* Gasto calórico medido pelos seus próprios dados, não pela fórmula.
   Se você comeu X por dia e o peso mudou Y, o gasto real sai dessa conta.
   Vale mais que qualquer estimativa — mas só depois de algumas semanas. */
/* ---------------------------------------------------------------------
   O RUMO: o peso está indo para onde você disse que queria?

   O app estima o gasto calórico por fórmula, e fórmula erra de 10 a 15%
   para muita gente. Quando erra, a meta sai errada, o peso vai para o
   lado contrário do objetivo, e a meta seguinte é calculada em cima do
   peso novo — que está errado pelo mesmo motivo. A conta se afunda
   sozinha, e nada avisava.

   Isto compara a direção real do peso nas últimas oito semanas com a
   direção pedida. Devolve null quando está tudo certo, ou quando ainda
   não há peso registrado o bastante para afirmar qualquer coisa: três
   pesagens e pelo menos três semanas entre a primeira e a última, porque
   abaixo disso é oscilação de água, não tendência.

function rumoPeso(){
 const ps=S.pesos.slice().sort((a,b)=>a.d<b.d?-1:1);
 const corte=addDias(hoje(),-56);
 const jan=ps.filter(x=>x.d>=corte);
 if(jan.length<3)return null;
 const a=jan[0],b=jan[jan.length-1],dias=diffDias(a.d,b.d);
 if(dias<21)return null;
 const delta=b.v-a.v, porSem=delta/(dias/7), imc=imcDe(b.v);
 const mc=metaCorpo(), obj=mc?(mc.kcal==='nenhuma'?'manter':mc.kcal):S.perfil.obj;
 let tipo=null;
 if(imc<18.5&&delta<=-0.5)tipo='magro';
 else if(obj==='ganhar'&&porSem<=-0.15)tipo='ganhar';
 else if(obj==='perder'&&porSem>=0.15)tipo='perder';
 else if(obj==='manter'&&Math.abs(porSem)>=0.3)tipo='manter';
 /* A segunda janela, de seis meses. A de oito semanas mede VELOCIDADE, e
    por isso não vê deriva lenta: 0,14 kg por semana some dentro da
    oscilação normal de água e intestino, mas em um ano são 7 kg. Numa
    simulação de doze meses, duas pessoas que pediram manter terminaram
    8 kg mais leves sem o app dizer nada, uma delas na borda de abaixo do
    peso. Esta janela olha o ACUMULADO: mais de 5% do corpo andando na
    direção contrária ao pedido é coisa para saber. */
 if(!tipo){
  const l=ps.filter(x=>x.d>=addDias(hoje(),-190));
  if(l.length>=5&&diffDias(l[0].d,l[l.length-1].d)>=120){
   const dl=l[l.length-1].v-l[0].v, pct=dl/l[0].v*100;
   const contra=(obj==='ganhar'&&pct<=-5)||(obj==='perder'&&pct>=5)||
                (obj==='manter'&&Math.abs(pct)>=5);
   if(contra)return{tipo:'deriva',obj,delta:Math.round(dl*10)/10,
    dias:diffDias(l[0].d,l[l.length-1].d),pct:Math.round(pct*10)/10,
    porSem:Math.round(dl/(diffDias(l[0].d,l[l.length-1].d)/7)*100)/100,
    imc:Math.round(imc*10)/10,peso:b.v};
  }
 }
 if(!tipo)return null;
 return{tipo,obj,delta:Math.round(delta*10)/10,dias,
  porSem:Math.round(porSem*100)/100,imc:Math.round(imc*10)/10,peso:b.v};
}
/* O cartão. Fica no diário de comida e na tela de peso — não no Perfil,

 return '<div class="card" style="border-color:var(--warn)">'+

    (Math.abs(dif)>=60

     :'')
   :'<p class="tiny muted" style="line-height:1.7;margin-top:10px">O app ainda não consegue medir o seu gasto real '+

  '<p class="xtiny muted" style="margin-top:10px;line-height:1.6">Este aviso olha oito semanas, não um dia. '+

function tdeeReal(){
 const d0=addDias(hoje(),-34);
 const dias=Object.keys(S.dias).filter(d=>d>=d0&&d<=hoje()).sort();
 /* só dias razoavelmente completos entram na média: um dia em que você
    registrou só o café puxa o resultado para baixo e estraga a conta */
 const comReg=dias.filter(d=>{
  const ref=S.dias[d].ref||{};
  const slots=MEALS.filter(m=>(ref[m.k]||[]).length).length;
  return slots>=3||totalDia(d).kcal>=metas().kcal*0.6;
 });
 const ps=S.pesos.filter(p=>p.d>=d0).sort((a,b)=>a.d<b.d?-1:1);
 if(comReg.length<10)return{faltam:'registre o dia inteiro em pelo menos 10 dias (contei '+comReg.length+
  '; dias com só uma ou duas refeições não entram, porque distorceriam a média)'};
 if(ps.length<2)return{faltam:'registre o peso pelo menos duas vezes'};
 const span=diffDias(ps[0].d,ps[ps.length-1].d);
 if(span<10)return{faltam:'as pesagens precisam estar a 10 dias ou mais de distância'};
 const mediaKcal=comReg.reduce((a,d)=>a+totalDia(d).kcal,0)/comReg.length;
 const deltaKg=ps[ps.length-1].v-ps[0].v;
 const tdee=mediaKcal-(deltaKg*7700/span);
 if(!isFinite(tdee)||tdee<800||tdee>6000)return{faltam:'os números ainda estão inconsistentes demais'};
 const o=S.perfil.obj;
 const alvo=o==='perder'?tdee*0.8:o==='ganhar'?tdee*1.15:tdee;
 return{dias:comReg.length,span,mediaKcal:Math.round(mediaKcal),deltaKg:n1(deltaKg),
  tdee:Math.round(tdee/10)*10,sugerido:Math.round(alvo/10)*10,atual:metas().kcal};
}
/* Estimativa de gordura corporal pelo método das circunferências (US Navy). */
function gorduraCorporal(){
 const ms=S.medidas.slice().sort((a,b)=>a.d<b.d?-1:1);
 const m=ms[ms.length-1];
 if(!m)return null;
 /* A equação de circunferências é publicada separada por sexo e não tem
    versão do meio. Sem a escolha, o app usa a feminina, que é a que
    também pede o quadril, e avisa na tela que o número depende disso. */
 const alt=S.perfil.altura,masc=S.perfil.sexo==='m',L=Math.log10;
 if(!m.cintura||!m.pescoco||!alt)return{faltam:true,d:m.d};
 let pct;
 if(masc)pct=495/(1.0324-0.19077*L(m.cintura-m.pescoco)+0.15456*L(alt))-450;
 else{if(!m.quadril)return{faltam:true,d:m.d};
  pct=495/(1.29579-0.35004*L(m.cintura+m.quadril-m.pescoco)+0.22100*L(alt))-450}
 if(!isFinite(pct)||pct<3||pct>70)return{faltam:true,d:m.d};
 const peso=pesoAtual();
 return{pct:n1(pct),d:m.d,gordura:n1(peso*pct/100),magra:n1(peso*(1-pct/100))};
}
/* Média móvel: a linha que mostra a tendência em vez do sobe e desce diário. */
function mediaMovel(pts,janela){
 janela=janela||7;
 return pts.map((p,i)=>{
  const ini=Math.max(0,i-janela+1),fatia=pts.slice(ini,i+1);
  return{x:p.x,y:fatia.reduce((a,z)=>a+z.y,0)/fatia.length};
 });
}
function totalRef(d,k){const it=((diaRO(d).ref||{})[k]||[]);
 return it.reduce((a,x)=>({kcal:a.kcal+(x.kcal||0),p:a.p+(x.p||0),c:a.c+(x.c||0),g:a.g+(x.g||0)}),{kcal:0,p:0,c:0,g:0})}
function totalDia(d){return MEALS.reduce((a,m)=>{const t=totalRef(d,m.k);
 return{kcal:a.kcal+t.kcal,p:a.p+t.p,c:a.c+t.c,g:a.g+t.g}},{kcal:0,p:0,c:0,g:0})}
function addItem(d,k,item,silencio){
 const x=dia(d);x.ref[k]=x.ref[k]||[];x.ref[k].push(item);
 S.recentes=[item,...S.recentes.filter(r=>r.n!==item.n)].slice(0,14);
 save('dia',d);save('base');
 if(!silencio){render();toast('Registrado em '+MEALS.find(m=>m.k===k).n)}
}
function pontuar(r){
 const des=S.despensa.map(nrm).filter(Boolean);
 if(!des.length)return null;
 let tem=0;const faltantes=[];
 r.ing.forEach(ing=>{const k=nrm(ing.k),nm=nrm(ing.n);
  if(des.some(d=>k.includes(d)||d.includes(k)||nm.includes(d)))tem++;else faltantes.push(ing.n)});
 return{tem,falta:r.ing.length-tem,pct:Math.round(tem/r.ing.length*100),faltantes};
}
/* Qual refeição cai antes e qual cai depois do treino de hoje. Usa a hora
   de treino do perfil; sem ela, não dá para saber e o app não inventa. */
function refeicoesDoTreino(d){
 const se=sessaoDe(d||hoje());
 if(!se.s||se.s.tipo!=='treino')return{treino:false,antes:'',depois:''};
 const h=S.perfil.horaTreino;
 if(!h)return{treino:true,antes:'',depois:''};
 const min=t=>{const x=String(t).split(':');return Number(x[0])*60+Number(x[1]||0)};
 const ht=min(h);
 let antes='',depois='',dAntes=1e9,dDepois=1e9;
 MEALS.forEach(function(r){
  const dif=min(r.h)-ht;
  if(dif<=0&&-dif<dAntes){dAntes=-dif;antes=r.k}
  if(dif>0&&dif<dDepois){dDepois=dif;depois=r.k}
 });
 return{treino:true,antes:antes,depois:depois};
}
/* O que já foi comido hoje, refeição por refeição. É daqui que o cardápio
   passou a partir: antes ele montava seis refeições do zero contra a meta
   do dia inteiro, e quem almoçasse e abrisse a tela às 15h via sugestão de
   almoço — a conta só fechava jogando fora o almoço que já tinha sido
   comido. */
function comidoHoje(){
 const d=hoje(),por={};let kcal=0,p=0;
 MEALS.forEach(function(ref){
  const t=totalRef(d,ref.k);por[ref.k]=t;kcal+=t.kcal;p+=t.p;
 });
 return{por,kcal:Math.round(kcal),p:Math.round(p)};
}
function gerarCardapio(semente){
 const m=metas(),out={};
 const sem=semente||Math.floor(Math.random()*9999);
 const tr=refeicoesDoTreino();
 const ja=comidoHoje();
 /* Só as refeições ainda em branco entram na sugestão. */
 const faltam=MEALS.filter(function(ref){return ja.por[ref.k].kcal<=0});
 const somaPct=faltam.reduce(function(a,r){return a+r.pct},0)||1;
 const restam=Math.max(0,m.kcal-ja.kcal);
 /* ISSN: 0,25 g de proteína por quilo por refeição, ou 20 a 40 g. */
 const pisoProt=Math.max(20,Math.min(40,Math.round(pesoAtual()*0.25)));
 /* Abaixo disto o app não sugere mais refeição nenhuma: a meta do dia já
    está alcançada pelo que foi registrado, e empurrar mais comida seria
    o app ensinando a ignorar saciedade. */
 if(restam<150)return{sem,itens:{},treino:tr,comido:ja.kcal,dia:hoje(),restam:Math.round(restam),cheio:true};
 const escolhas={};
 faltam.forEach((ref,ri)=>{
  /* O alvo da refeição não é mais a fatia dela do dia inteiro: é a fatia
     dela do que AINDA FALTA, redistribuída entre as que sobraram. */
  const alvo=Math.max(80,restam*(ref.pct/somaPct));
  let cand=filtraRestr(RECIPES).filter(r=>r.ref.includes(ref.k));
  /* Se as restrições deixarem a refeição sem nenhuma opção, o app abre a
     mão do horário antes de abrir a mão da restrição: sugerir frango para
     quem marcou "sem carne" é pior do que sugerir jantar no café. */
  if(!cand.length)cand=filtraRestr(RECIPES);
  if(!cand.length)cand=RECIPES;
  const principal=ref.pct>=.20;
  const perto=tr.treino&&(ref.k===tr.antes||ref.k===tr.depois);
  const scored=cand.map(r=>{const p=pontuar(r);
   let s=Math.abs(r.kcal-alvo)/alvo-(p?p.pct/260:0)-(S.favs.includes(r.id)?.15:0);
   /* refeição principal que bate o piso de proteína sobe na lista */
   if(principal&&r.p>=pisoProt)s-=.12;
   /* em volta do treino, carboidrato junto da proteína */
   if(perto){
    if(r.c>=30)s-=.14;
    if(r.p>=pisoProt*.8)s-=.10;
   }
   return{r,s};})
   .sort((a,b)=>a.s-b.s);
  const janela=scored.slice(0,Math.min(4,scored.length));
  /* Não repetir a mesma receita no mesmo dia. Com o app inteiro
     disponível isto nunca faz falta — cada refeição tem quatro
     candidatas e elas raramente colidem. Com filtro apertado faz toda a
     falta: no caso extremo, sobrando uma receita só, o cardápio sugeria
     a mesma coisa seis vezes. */
  const usados=Object.keys(out).map(k=>out[k]);
  let pick=janela[(sem+ri*3)%janela.length].r.id;
  if(usados.indexOf(pick)>=0){
   const livre=janela.find(z=>usados.indexOf(z.r.id)<0)
     ||scored.find(z=>usados.indexOf(z.r.id)<0);
   /* Sem receita nova para esta refeição, ela fica em branco. Seis
      sugestões iguais não são um cardápio. */
   if(!livre)return;
   pick=livre.r.id;
  }
  out[ref.k]=pick;
  /* Guardo as melhores candidatas desta refeição para a segunda passada.
     Doze é o bastante para fechar a conta sem abrir mão da qualidade: a
     segunda passada só escolhe entre receitas que a primeira já aprovou. */
  escolhas[ref.k]=scored.slice(0,Math.min(12,scored.length)).map(z=>z.r);
 });

 /* -------------------------------------------------------------------
    SEGUNDA PASSADA: fechar o total do dia.
    Cada refeição foi escolhida sozinha, mirando a fatia dela do que
    falta — e seis escolhas boas isoladamente somam um dia ruim. Numa
    conferência real, com o almoço já registrado, o dia fechava 522 kcal
    abaixo da meta.
    Aqui o app troca, uma de cada vez, a refeição cuja troca mais
    aproxima o TOTAL do dia da meta. Para quando chega perto o bastante
    ou quando nenhuma troca melhora.
    ------------------------------------------------------------------- */
 const kcalDe=id=>{const r=RECIPES.find(z=>z.id===id);return r?r.kcal:0};
 const totalCom=o=>ja.kcal+faltam.reduce((a,ref)=>a+kcalDe(o[ref.k]),0);
 const perto=m.kcal*0.04;
 for(let passo=0;passo<12;passo++){
  const erro=Math.abs(totalCom(out)-m.kcal);
  if(erro<=perto)break;
  let melhor=null;
  faltam.forEach(function(ref){
   (escolhas[ref.k]||[]).forEach(function(r){
    if(r.id===out[ref.k])return;
    /* a mesma receita não entra duas vezes no mesmo dia */
    if(faltam.some(o=>o.k!==ref.k&&out[o.k]===r.id))return;
    const tent=Object.assign({},out);tent[ref.k]=r.id;
    const e2=Math.abs(totalCom(tent)-m.kcal);
    if(e2<erro-1&&(!melhor||e2<melhor.e))melhor={k:ref.k,id:r.id,e:e2};
   });
  });
  if(!melhor)break;
  out[melhor.k]=melhor.id;
 }

 /* -------------------------------------------------------------------
    TERCEIRA PASSADA: tirar refeição que só faz passar da meta.
    A troca acima só TROCA. Quando restam 160 kcal do dia e ainda há
    quatro refeições em branco, nenhuma combinação fecha: a menor receita
    do app tem perto de 200 kcal, e espalhar quatro delas estourava a
    meta em 745 kcal numa conferência real.
    Em dia normal esta passada não remove nada, porque tirar qualquer
    refeição piora o erro. Ela só age quando o que sobrou do dia não
    comporta mais uma refeição inteira.
    ------------------------------------------------------------------- */
 for(let passo=0;passo<6;passo++){
  const erro=Math.abs(totalCom(out)-m.kcal);
  let pior=null;
  faltam.forEach(function(ref){
   if(!out[ref.k])return;
   const tent=Object.assign({},out);delete tent[ref.k];
   const e2=Math.abs(totalCom(tent)-m.kcal);
   if(e2<erro-1&&(!pior||e2<pior.e))pior={k:ref.k,e:e2};
  });
  if(!pior)break;
  delete out[pior.k];
 }
 /* 'comido' é a assinatura do dia no momento em que este cardápio foi
    montado. A tela compara com o valor atual e remonta quando muda, para
    o cardápio não ficar falando de um dia que já passou. */
 return{sem,itens:out,treino:tr,comido:ja.kcal,dia:hoje(),restam:Math.round(restam)};
}

/* =====================================================================
   ROTINA DO DIA — monta a linha do tempo completa
   ===================================================================== */

  .filter(function(e2){return e2.offsetParent!==null||e2===document.activeElement});

/* ---------- gráficos ---------- */
function lineChart(pts,unid,cor,media){
 if(pts.length<2)return vazio('chart','Registre pelo menos duas medições para o gráfico aparecer.');
 cor=cor||'var(--pink)';
 const W=560,H=172,L=40,R=14,T=14,B=26;
 const ys=pts.map(p=>p.y),mn=Math.min(...ys),mx=Math.max(...ys),pad=(mx-mn)||Math.max(1,mx*.05);
 const lo=mn-pad*.3,hi=mx+pad*.3;
 const X=i=>L+i*(W-L-R)/(pts.length-1),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
 let g='',lbl='';
 for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3,y=Y(v);
  g+='<line class="gl" x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'"/>'+
   '<text x="'+(L-7)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+n1(v)+'</text>';}
 const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
 const area=d+' L'+X(pts.length-1).toFixed(1)+' '+(H-B)+' L'+L+' '+(H-B)+' Z';
 const step=Math.ceil(pts.length/6);
 pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1)
  lbl+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.x)+'</text>'});
 const dots=pts.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(i===pts.length-1?4.2:2.4)+'" fill="'+cor+'"/>').join('');
 const gid='gr'+Math.random().toString(36).slice(2,7);
 return '<div class="chartbox"><svg class="chart" viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:290px;height:auto" role="img" aria-label="Evolução em '+esc(unid||'')+'">'+
  '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
  '<stop offset="0%" stop-color="'+cor+'" stop-opacity=".26"/><stop offset="100%" stop-color="'+cor+'" stop-opacity="0"/></linearGradient></defs>'+
  g+'<path d="'+area+'" fill="url(#'+gid+')"/><path class="ln" d="'+d+'" stroke="'+cor+'"/>'+
  (media&&media.length===pts.length?'<path d="'+media.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ')+
   '" fill="none" stroke="var(--ink-3)" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round"/>':'')+
  dots+lbl+'</svg></div>';
}
function barChart(pts,meta,cor){
 if(!pts.length)return vazio('chart','Sem dados no período.');
 cor=cor||'var(--blue)';
 const W=560,H=152,L=40,R=14,T=12,B=24;
 const mx=Math.max(meta||0,...pts.map(p=>p.y),1)*1.14;
 const bw=(W-L-R)/pts.length,Y=v=>T+(1-v/mx)*(H-T-B);
 let s='';
 for(let i=0;i<3;i++){const v=mx*i/2,y=Y(v);
  s+='<line class="gl" x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'"/>'+
   '<text x="'+(L-7)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+Math.round(v)+'</text>';}
 pts.forEach((p,i)=>{const h=Math.max(0,(H-B)-Y(p.y));
  s+='<rect x="'+(L+i*bw+bw*.17).toFixed(1)+'" y="'+Y(p.y).toFixed(1)+'" width="'+(bw*.66).toFixed(1)+
   '" height="'+h.toFixed(1)+'" rx="3" fill="'+(p.y?cor:'var(--line)')+'"/>'+
   '<text x="'+(L+i*bw+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+esc(p.x)+'</text>';});
 if(meta){const y=Y(meta);s+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+
  '" stroke="var(--pink)" stroke-width="1.6" stroke-dasharray="5 4"/>'}
 return '<div class="chartbox"><svg class="chart" viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:290px;height:auto">'+s+'</svg></div>';
}

const DISFARCES=[['','Norte, normal'],['Notas','Notas'],['Lista','Lista'],
 ['Agenda','Agenda'],['Estudos','Estudos'],['Receitas','Receitas']];
function nomeDoApp(){return S.perfil.disfarce||'Norte'}
/* Encolher o cabeçalho ao rolar. É só uma classe: sem isso o painel do dia
   ocupava quase um quinto da tela do celular o tempo inteiro. */
/* Com oito sub-abas, a ativa pode estar fora do campo de visão depois de
   um render. Isto a traz para perto da borda esquerda, sem animação brusca. */
/* Esta função custava de 110 a 180 ms por render — mais que todo o resto
   do app junto — porque percorria as faixas de TODAS as abas, inclusive
   as escondidas, e lia offsetLeft logo depois de o innerHTML ter sido
   reescrito. Ler offsetLeft ali obriga o navegador a refazer o layout do
   documento inteiro na hora, parado, três vezes por render.

   Agora: só a faixa da aba visível, só quando a sub-aba ativa mudou, e
   dentro de requestAnimationFrame, para a leitura cair depois do layout
   que o navegador já ia fazer sozinho. */
let subAbaUltima='';
function centralizaSubAba(forcar){
 const marca=S.ui.tab+':'+(S.ui.sub[S.ui.tab]||'');
 if(!forcar&&marca===subAbaUltima)return;
 subAbaUltima=marca;
 const aba=document.querySelector('#tab-'+S.ui.tab);
 if(!aba)return;
 const f=aba.querySelector('.subtabs');
 if(!f)return;
 requestAnimationFrame(function(){
  const on=f.querySelector('.subtab.on,.chip.on');
  if(!on)return;
  const alvo=on.offsetLeft-16;
  if(Math.abs(f.scrollLeft-alvo)>8)f.scrollTo({left:Math.max(0,alvo),behavior:'smooth'});
 });
}

}

function proxLembrete(){
 const ag=agoraMin();
 const lista=[...(S.perfil.lembretes||[]).map(h=>({h,t:'beber água'})),
  ...(S.perfil.alarmes||[]).map(a=>({h:a.h,t:a.t.toLowerCase()})),
  ...MEALS.map(m=>({h:m.h,t:m.n.toLowerCase()}))].sort((a,b)=>hm2min(a.h)-hm2min(b.h));
 return lista.find(x=>hm2min(x.h)>ag)||null;

function movsBloqueados(){
 const bloq={};
 limitesOn().forEach(l=>l.tira.forEach(k=>{bloq[k]=1}));

   entre ombro e quadril: elevação lateral, que alarga o ombro visto de
   frente, e glúteo isolado, que marca o quadril visto de lado. Os
   movimentos grandes ficam todos. */
function movsDaTrilha(){
 return S.perfil.trilha==='andro'?{elevacao:1,ponte:1}:{};
}
function aplicaTrilha(lista){
 const tira=movsDaTrilha();
 if(!Object.keys(tira).length)return lista;
 const fora=[],out=[];
 lista.forEach(function(ex){
  const m=movDe(ex.n);
  if(m&&tira[m.k]){fora.push(ex.n);return}
  out.push(ex);
 });
 if(fora.length)out.foraTrilha=fora;
 return out;
}
function exBloqueado(nome){
 const m=movDe(nome);
 return !!(m&&movsBloqueados()[m.k]);
}
/* Substituto do mesmo grupo muscular que não esbarre em nenhuma limitação. */
function substitutoDe(nome){
 const g=grupoDe(nome),bloq=movsBloqueados(),vistos={};
 /* Só vale o que o plano ofereceria a esta pessoa: quem marcou calistenia
    não recebe exercício com elástico nem máquina de academia. Quando não
    existe substituto possível, o exercício simplesmente sai. */
 for(const k of Object.keys(W)){
  for(const ex of (listaBase(k)||[])){
   if(vistos[ex.n]||ex.n===nome)continue;
   vistos[ex.n]=1;
   if(grupoDe(ex.n)!==g)continue;
   const m=movDe(ex.n);
   if(m&&bloq[m.k])continue;
   return ex.n;
  }
 }
 return null;
}

/* Trocar um exercício por outro do mesmo grupo muscular. A escolha fica
   guardada e vale para todos os treinos seguintes. */
function sheetTrocarEx(nome){
 const g=grupoDe(nome);
 const vistos={},opcoes=[];
 Object.keys(W).forEach(k=>{
  ['gym','home','cal'].forEach(modo=>{
   (W[k][modo]||[]).forEach(ex=>{
    if(ex.n===nome||vistos[ex.n]||grupoDe(ex.n)!==g)return;

 });

 sheet('Trocar exercício',
  '<p class="tiny muted" style="margin-bottom:12px">No lugar de <b>'+esc(nome)+'</b>, escolha outro de '+

  (atual?'<p class="tiny" style="margin-bottom:11px">Hoje está trocado por <b>'+esc(atual)+'</b>. '+
   '<button class="btn gh xs" data-a="destrocar" data-n="'+esc(nome)+'">desfazer troca</button></p>':'')+
  '<div class="stack" style="gap:7px">'+(opcoes.length?opcoes.sort().map(o=>

function stVolume(){
 const sem=[];for(let i=27;i>=0;i--)sem.push(addDias(hoje(),-i));
 const vol={},volSem={};
 sem.forEach(ds=>{
  const se=sessaoDe(ds);if(!se.s)return;

  exs.forEach((ex,i)=>{const n=sets[se.key+':'+i]||0;if(!n)return;
   const g=grupoDe(ex.n);vol[g]=(vol[g]||0)+n;
   if(diffDias(ds,hoje())<7)volSem[g]=(volSem[g]||0)+n;});
 });
 const ord=Object.keys(vol).sort((a,b)=>vol[b]-vol[a]);
 const totalSets=Object.values(vol).reduce((a,b)=>a+b,0);
 return ''+
  '<div class="card">'+chTtl('chart','Volume por grupo muscular','<span class="tag n">28 dias</span>')+
  (ord.length?hBars(ord.map(g=>({x:g,y:vol[g]})),'var(--blue)'):
   vazio('chart','Marque as séries durante o treino para o volume aparecer aqui.'))+
  (totalSets?'<p class="xtiny muted" style="margin-top:10px"><b class="num">'+totalSets+'</b> séries nos últimos 28 dias. '+
   'Referência para hipertrofia: 10 a 20 séries por grupo por semana. Abaixo de 10 o estímulo costuma ser pequeno; acima de 22 a recuperação começa a pesar. '+

  '</div>'+
  (Object.keys(volSem).length?'<div class="card">'+chTtl('target','Esta semana')+
   '<div class="stack" style="gap:0">'+Object.keys(volSem).sort((a,b)=>volSem[b]-volSem[a]).map(g=>{

   O único suplemento que este app menciona por nome. Ele passou cinco

   barrinha e shake — e errado para creatina, que é a substância com mais
   ensaio aleatorizado em cima dela na nutrição esportiva inteira.

   Duas coisas que este bloco precisa dizer e que quase nenhum texto de
   academia diz. A primeira é o tamanho do efeito, que é PEQUENO: 0,11 em
   desvio padrão, intervalo passando pelo zero. A segunda é o exame: a
   creatina vira creatinina no corpo, e creatinina é o que o laboratório
   usa para estimar função do rim. O valor sobe sem o rim ter nada — e
   creatinina está na lista de exames de acompanhamento hormonal deste
   app, então essa confusão ia acontecer aqui dentro.
   --------------------------------------------------------------------- */
const CREATINA=[
 ['O que ela faz, e quanto','Aumenta a reserva de energia rápida do músculo, o que rende um pouco mais de trabalho em série pesada. Medindo músculo direto, por ressonância e ultrassom, o ganho extra foi de 0,10 a 0,16 cm de espessura — pequeno e real. Ela não queima gordura, não é hormônio e não muda nada ligado a transição.'],
 ['Quem ganha mais','Quem come pouca ou nenhuma carne. A reserva de creatina do corpo vem sobretudo da carne, então quem é vegetariana ou come carne raramente começa com o tanque mais baixo e sobe mais. Numa revisão de nove estudos, esse grupo ganhou massa magra, força e resistência muscular.'],

function totalMicro(d){
 let fib=0,na=0,fe=0,ca=0,com=0,sem=0;
 MEALS.forEach(function(m){
  ((diaRO(d).ref||{})[m.k]||[]).forEach(function(x){
   if(x.fib!=null||x.na!=null||x.fe!=null||x.ca!=null){
    com++;fib+=x.fib||0;na+=x.na||0;fe+=x.fe||0;ca+=x.ca||0;
   }else sem++;
  });
 });
 return{fib:fib,na:na,fe:fe,ca:ca,com:com,sem:sem};
}

   usa o que já sabe da trilha e do registro de ciclo. */
function menstrua(){
 if(S.perfil.trilha==='fem')return false;
 /* Antes isto saía do campo de referência do cálculo, o que era errado:
    aquele campo é sobre a constante da fórmula, não sobre o corpo de
    ninguém. Agora sai do que a pessoa de fato registrou. */
 return (S.ciclo.regras||[]).length>0;
}
function alvoMicro(r){
 if(r.k==='fe')return menstrua()?r.alvo:r.alvoSem;
 return r.alvo;
}

/* =====================================================================

   O app tinha dezenas de receitas e nenhum jeito de dizer "eu não como
   carne". Agora tem — e a classificação não é escrita à mão receita por
   receita: ela sai da lista de ingredientes, que já existia porque o
   sistema de despensa usa essas mesmas chaves. Receita nova se
   classifica sozinha, e não tem como eu esquecer de marcar.

   O casamento é por token, não por pedaço de palavra: 'mel' não pode
   casar com 'melancia', e 'carne moída' tem que casar com 'carne'.

const ING_GRUPO={
 carne:['carne','frango','peixe','atum','sardinha','tilapia'],

   norma não tem um item genérico de "castanhas". O item 18 é látex, que
   não é comida, e está aqui porque está na lista.

   'tok' são os termos procurados na chave E no nome de cada ingrediente,
   com limite de palavra — 'amendoim' precisa pegar "Pasta de amendoim",
   'soja' precisa pegar "Bebida de soja sem açúcar" e "Óleo de soja".

 {id:'vegetariana',n:'Sem carne',exclui:['carne'],

function tokenBate(chave,tok){
 const k=nrm(chave);
 return k===tok||k.indexOf(tok+' ')===0||k.indexOf(tok+'-')===0||k.indexOf(tok+' de ')===0;
}
function recTemGrupo(r,g){
 const toks=ING_GRUPO[g]||[];
 return r.ing.some(function(x){return toks.some(function(t){return tokenBate(x.k,t)})});
}
/* Para alergia o casamento é mais largo e mais cuidadoso ao mesmo tempo:
   olha a chave E o nome do ingrediente, mas com limite de palavra, para
   'ovo' não casar com 'novo' nem 'mel' com 'melancia'. */
function palavraEm(txt,tok){
 const t=nrm(txt), k=nrm(tok);
 if(!k)return false;
 const i2=t.indexOf(k);
 if(i2<0)return false;
 const antes=i2===0?'':t[i2-1], depois=(i2+k.length>=t.length)?'':t[i2+k.length];
 const letra=function(c){return c&&/[a-z0-9]/.test(c)};
 return !letra(antes)&&!letra(depois);
}
function ingCasa(ing,toks){
 return toks.some(function(t){return palavraEm(ing.k,t)||palavraEm(ing.n,t)});
}
/* 'nao' tira falso positivo de palavra parecida. O caso real que me
   obrigou a criar isto: o token 'noz' casava com 'noz-moscada', que é
   semente e não está na lista da norma — a busca por palavra inteira não
   resolve, porque 'noz' É palavra inteira dentro de 'noz-moscada'. */
function recTemAlergia(r,a){
 if(!a.tok.length)return false;
 return r.ing.some(function(x){
  if((a.nao||[]).some(function(t){return nrm(x.n).indexOf(nrm(t))>=0}))return false;
  return ingCasa(x,a.tok);
 });
}
function alergiasAtivas(){
 const ids=S.perfil.alergias||[];
 return ALERGIAS.filter(function(a){return ids.indexOf(a.id)>=0});
}
function semIngAtivos(){
 return (S.perfil.semIng||[]).map(function(x){return String(x||'').trim()}).filter(Boolean);
}
/* Qual alergia ou ingrediente barrou esta receita. Devolve os nomes, para
   a tela poder dizer o motivo em vez de só sumir com a receita. */
function recBarrada(r){
 const out=[];
 alergiasAtivas().forEach(function(a){if(recTemAlergia(r,a))out.push(a.n.toLowerCase())});
 semIngAtivos().forEach(function(t){
  if(r.ing.some(function(x){return ingCasa(x,[t])}))out.push(t.toLowerCase());
 });
 gruposFora().forEach(function(g){
  if(recTemGrupo(r,g))out.push({carne:'carne, frango ou peixe',ovo:'ovo',
   leite:'leite ou derivado',trigo:'trigo',mel:'mel'}[g]);
 });
 return [...new Set(out)];
}
function restrAtivas(){
 const ids=S.perfil.restricoes||[];
 return RESTRICOES.filter(function(x){return ids.indexOf(x.id)>=0});
}
/* Os grupos proibidos pelo conjunto de restrições que estão ligadas. */
function gruposFora(){
 const out={};
 restrAtivas().forEach(function(x){x.exclui.forEach(function(g){out[g]=1})});
 return Object.keys(out);
}
function recPassa(r){
 const fora=gruposFora();
 if(fora.some(function(g){return recTemGrupo(r,g)}))return false;
 const als=alergiasAtivas();
 if(als.some(function(a){return recTemAlergia(r,a)}))return false;
 const li=semIngAtivos();
 if(li.length&&r.ing.some(function(x){return ingCasa(x,li)}))return false;
 return true;
}
function temFiltro(){
 return gruposFora().length>0||alergiasAtivas().length>0||semIngAtivos().length>0;
}
function filtraRestr(arr){
 return temFiltro()?arr.filter(recPassa):arr;
}
/* Três níveis, com peso visual diferente de propósito: preferência é
   escolha, alergia não é, e ingrediente livre existe porque alergia não
   cabe em lista fechada. */
/* A lista de receitas não muda enquanto o app roda, então contar quantas
   cada alergênico tira é trabalho que se faz uma vez. Antes era refeito
   a cada desenho da tela, dezoito vezes. */
const _contaCache=new Map();
function contaBarradas(fn,chave){
 if(chave&&_contaCache.has(chave))return _contaCache.get(chave);
 let n=0; RECIPES.forEach(function(r){if(fn(r))n++});
 if(chave)_contaCache.set(chave,n);
 return n;
}

/* =====================================================================
   CÓDIGO DE BARRAS
   A câmera lê o código e os valores vêm da Open Food Facts, uma base
   aberta e colaborativa de produtos. Se o navegador não souber ler
   código, dá para digitar os números na mão.
   ===================================================================== */
let scanStream=null,scanLoop=null,ultimoScan=null;
function pararCamera(){
 if(scanLoop){clearInterval(scanLoop);scanLoop=null}
 if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
}
function sheetScan(){
 const temLeitor=(typeof window.BarcodeDetector!=='undefined');
 sheet('Código de barras',
  (temLeitor?'<div class="scanwrap"><video id="scanVid" playsinline muted autoplay></video><div class="scanmira"></div></div>'+
    '<p class="xtiny muted" style="margin:9px 0 13px;text-align:center">Aponte a câmera para o código de barras da embalagem.</p>'
   :'<p class="tiny muted" style="margin-bottom:12px">Este navegador não lê código pela câmera. '+
     'Digite os números que ficam embaixo das barras.</p>')+
  '<div class="row" style="gap:7px"><input type="number" inputmode="numeric" id="codIn" placeholder="7891234567890" class="grow">'+
  '<button class="btn sm" data-a="buscar-cod">Buscar</button></div>'+
  '<div id="scanRes" style="margin-top:14px"></div>','Produtos de embalagem');
 if(temLeitor)iniciarCamera();
}
function iniciarCamera(){
 const v=$('#scanVid');if(!v)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return avisoCamera();
 navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(st=>{
  if(!$('#scanVid')){st.getTracks().forEach(t=>t.stop());return}
  scanStream=st;v.srcObject=st;v.play().catch(()=>{});
  const det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
  scanLoop=setInterval(()=>{
   const vid=$('#scanVid');
   if(!vid)return pararCamera();
   det.detect(vid).then(cods=>{
    if(cods&&cods.length){pararCamera();buscarCodigo(cods[0].rawValue)}
   }).catch(()=>{});
  },700);
 }).catch(avisoCamera);
}
function avisoCamera(){
 const w=document.querySelector('.scanwrap');
 if(w)w.outerHTML='<p class="tiny" style="color:var(--warn);margin-bottom:12px">'+
  'Não consegui abrir a câmera. Digite o número do código abaixo.</p>';
}
function buscarCodigo(cod){
 const res=$('#scanRes');if(!res)return;
 cod=String(cod||'').replace(/\D/g,'');
 if(cod.length<8){res.innerHTML='<p class="tiny" style="color:var(--warn)">Código curto demais.</p>';return}
 res.innerHTML='<p class="tiny muted">Procurando '+esc(cod)+'…</p>';
 fetch('https://world.openfoodfacts.org/api/v2/product/'+cod+
   '.json?fields=product_name,product_name_pt,brands,nutriments')
  .then(r=>r.json())
  .then(j=>{
   const p=j&&j.product;
   if(!j||j.status!==1||!p)throw new Error('sem produto');
   const n=p.nutriments||{};
   let kcal=Number(n['energy-kcal_100g']);
   if(!kcal&&n.energy_100g)kcal=Number(n.energy_100g)/4.184;
   if(!kcal||!isFinite(kcal))throw new Error('sem valores');
   const nome=[(p.product_name_pt||p.product_name||'').trim(),(p.brands||'').split(',')[0].trim()]
    .filter(Boolean).join(' — ').slice(0,70)||('Produto '+cod);
   /* a base aberta também traz fibra, sódio, ferro e cálcio quando o
      rótulo informa; o que não vier fica em branco e não entra na conta */
   const sodio=n.sodium_100g!=null?Number(n.sodium_100g)*1000
    :(n.salt_100g!=null?Number(n.salt_100g)*400:null);
   ultimoScan={n:nome,kcal:Math.round(kcal),p:Number(n.proteins_100g)||0,
    c:Number(n.carbohydrates_100g)||0,g:Number(n.fat_100g)||0,
    fib:isFinite(Number(n.fiber_100g))?Number(n.fiber_100g):null,
    na:isFinite(sodio)?sodio:null,
    fe:isFinite(Number(n.iron_100g))?Number(n.iron_100g)*1000:null,
    ca:isFinite(Number(n.calcium_100g))?Number(n.calcium_100g)*1000:null};
   if(!$('#scanRes'))return;
   $('#scanRes').innerHTML='<div class="ex"><div class="nm">'+esc(ultimoScan.n)+'</div>'+
    '<div class="meta">'+ultimoScan.kcal+' kcal · P '+n1(ultimoScan.p)+' C '+n1(ultimoScan.c)+
    ' G '+n1(ultimoScan.g)+' por 100 g</div>'+
    '<div class="row" style="gap:7px;margin-top:11px">'+
    '<input type="number" inputmode="numeric" id="scanG" value="100" class="grow">'+
    '<button class="btn acc" data-a="add-scan">Registrar</button></div>'+
    '<p class="xtiny muted" style="margin-top:8px">Valores da base aberta Open Food Facts. '+
    'Confira no rótulo se parecer estranho.</p></div>';
  })
  .catch(()=>{
   if(!$('#scanRes'))return;
   $('#scanRes').innerHTML='<p class="tiny" style="color:var(--warn)">Não achei esse produto na base aberta. '+
    'Use a aba Manual e copie os valores do rótulo da embalagem.</p>';
  });
}

/* ---------------------------------------------------------------------
   MEDIR A VOZ PELO MICROFONE
   A conta é autocorrelação, a mesma de qualquer afinador: desliza uma
   cópia do pedaço de som por cima dele mesmo e procura em que
   deslocamento as duas mais combinam. Esse deslocamento é o período da
   onda, e a frequência é um dividido por ele.

   O som nunca é gravado, nunca sai do aparelho e o microfone é desligado
   no fim. O que fica é um número.
   --------------------------------------------------------------------- */
const VOZ_MIN_HZ=70, VOZ_MAX_HZ=500;
/* Abaixo deste volume é silêncio: sem isso o ruído da sala vira número
   com cara de resultado. */
const VOZ_RUIDO=0.012;
/* O quanto as duas cópias precisam combinar para a leitura valer. */
const VOZ_CONF=0.90;

/* Reduzir a taxa por quatro antes de contar. Voz vai até 500 Hz, e 48
   mil amostras por segundo são dezesseis vezes mais do que essa conta
   precisa — a 12 mil, 500 Hz ainda tem 24 amostras por onda. A conta cai
   por dezesseis: de 85 ms para cerca de 5. A média de quatro em quatro
   serve de filtro simples contra o agudo que sobraria. */
const VOZ_REDUZ=4;
function reduz(buf,k){
 const m=Math.floor(buf.length/k), out=new Float32Array(m);
 for(let i=0;i<m;i++){
  let s2=0;for(let j=0;j<k;j++)s2+=buf[i*k+j];
  out[i]=s2/k;
 }
 return out;
}
function alturaDe(bufCru,taxaCrua){
 let soma0=0;
 for(let i=0;i<bufCru.length;i++)soma0+=bufCru[i]*bufCru[i];
 const rms=Math.sqrt(soma0/bufCru.length);
 if(rms<VOZ_RUIDO)return null;            /* silêncio */

 const buf=reduz(bufCru,VOZ_REDUZ), taxa=taxaCrua/VOZ_REDUZ;
 const n=buf.length;
 const minA=Math.floor(taxa/VOZ_MAX_HZ), maxA=Math.floor(taxa/VOZ_MIN_HZ);
 if(n<maxA*2)return null;                 /* pedaço curto para o grave */

 /* Correlação NORMALIZADA. A versão crua — só somar x[i]*x[i+atraso] —
    encolhe sozinha conforme o atraso cresce, porque sobram menos termos
    para somar. Medindo confiança em cima dela, voz grave nunca passava:
    não era a voz que estava ruim, era a régua que encolhia. Dividindo
    pela energia dos dois pedaços comparados, 1,0 passa a querer dizer
    "são a mesma forma de onda", em qualquer atraso. */
 const r=new Float32Array(maxA+1);
 const m=n-maxA;                          /* janela fixa, sem encolher */
 let e0=0;
 for(let i=0;i<m;i++)e0+=buf[i]*buf[i];
 if(e0<=0)return null;
 for(let atraso=minA;atraso<=maxA;atraso++){
  let num=0,e1=0;
  for(let i=0;i<m;i++){const b=buf[i+atraso];num+=buf[i]*b;e1+=b*b}
  r[atraso]=(e1>0)?num/Math.sqrt(e0*e1):0;
 }

 /* O pico mais alto NÃO é o período: o dobro e o triplo dele também
    combinam bem, e às vezes melhor. Período é o MENOR deslocamento que
    já funciona — então pego o primeiro pico que chega perto do melhor. */
 let melhorV=-1;
 for(let a=minA;a<=maxA;a++)if(r[a]>melhorV)melhorV=r[a];
 if(melhorV<VOZ_CONF)return null;
 const corte=melhorV*0.92;
 let melhor=-1;
 for(let a=minA+1;a<maxA;a++){
  if(r[a]>=corte&&r[a]>=r[a-1]&&r[a]>=r[a+1]){melhor=a;break}
 }
 if(melhor<0)return null;

 /* Ruído aleatório devolvia 490 Hz com 96% de certeza: pior que não
    medir, porque é número errado com cara de certo numa tela em que a
    pessoa vai anotar e comparar daqui a meses.
    Onda periódica de verdade combina consigo mesma em T, em 2T e em 3T.
    Ruído combina num ponto por acaso e não combina no dobro. É o teste
    mais barato que separa os dois. */
 const dobro=melhor*2;
 if(dobro<=maxA&&r[dobro]<melhorV*0.55)return null;

 /* Parábola pelos três pontos em volta do pico: dá a casa decimal do
    período, que em voz grave vale vários Hz. */
 const y1=r[melhor-1],y2=r[melhor],y3=r[melhor+1];
 const den=2*(2*y2-y1-y3);
 let ajuste=den?(y3-y1)/den:0;
 if(!isFinite(ajuste)||Math.abs(ajuste)>1)ajuste=0;
 const hz=taxa/(melhor+ajuste);
 if(!isFinite(hz)||hz<VOZ_MIN_HZ||hz>VOZ_MAX_HZ)return null;

 /* CONFERIR NO SOM ORIGINAL.
    Reduzir a taxa tirando média de quatro amostras é um filtro de agudo,
    e filtrar ruído branco deixa ele correlacionado — eu fabricava a
    periodicidade que depois encontrava. Era por isso que ruído puro dava
    456 Hz com 99% de certeza, em vinte de vinte tentativas.

    Confiança não separa (o ruído dava 99%) e estabilidade também não:
    o ruído variava 7%, e fala humana de verdade varia MAIS que isso,
    porque entonação mexe na altura o tempo todo. Uma regra de
    estabilidade reprovaria a voz e aprovaria o ruído.

    O que separa é voltar ao sinal cru e perguntar se ele se repete
    naquele período. Onda periódica se repete; ruído branco não se repete
    em atraso nenhum, por mais que a versão suavizada dele pareça. */
 const atrasoCru=Math.round(taxaCrua/hz);
 const mc=bufCru.length-atrasoCru;
 if(mc<atrasoCru)return null;
 let numC=0,eA=0,eB=0;
 for(let i=0;i<mc;i++){
  const a2=bufCru[i],b2=bufCru[i+atrasoCru];
  numC+=a2*b2;eA+=a2*a2;eB+=b2*b2;
 }
 const confCru=(eA>0&&eB>0)?numC/Math.sqrt(eA*eB):0;
 if(confCru<0.62)return null;

 return{hz:hz,conf:confCru,rms:rms};
}
function mediana(v){
 if(!v.length)return 0;
 const o=v.slice().sort(function(a,b){return a-b});
 const i=Math.floor(o.length/2);
 return o.length%2?o[i]:(o[i-1]+o[i])/2;
}
const NOTAS=['dó','dó#','ré','ré#','mi','fá','fá#','sol','sol#','lá','lá#','si'];
function notaDe(hz){
 const n=Math.round(12*Math.log2(hz/440))+69;
 return NOTAS[((n%12)+12)%12]+Math.floor(n/12-1);
}

let vozAudio=null,vozFluxo=null,vozLoop=null;
function pararMedidor(){
 if(vozLoop){cancelAnimationFrame(vozLoop);vozLoop=null}
 if(vozFluxo){vozFluxo.getTracks().forEach(function(t){t.stop()});vozFluxo=null}
 if(vozAudio){try{vozAudio.close()}catch(e){}vozAudio=null}
}

  'que a tela de voz treina. Ressonância, peso vocal e entonação não têm número — e voz lida como '+esc(alvo.nome.toLowerCase())+
  ' não é só hertz. A faixa alvo serve de referência, não de nota.</p>',
  'Faixa alvo: '+alvo.hz);

 const elHz=$('#vozHz'),elNota=$('#vozNota'),elBarra=$('#vozBarra'),elConta=$('#vozConta'),bt=$('#vozBt');
 let lendo=false,leituras=[];
 bt.onclick=function(){
  if(lendo){pararMedidor();lendo=false;bt.textContent='Começar a medir';return fecharMedida()}
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})
   .then(function(fluxo){
    vozFluxo=fluxo;lendo=true;leituras=[];
    bt.textContent='Parar e ver o resultado';
    $('#vozFim').innerHTML='';
    vozAudio=new (window.AudioContext||window.webkitAudioContext)();
    const fonte=vozAudio.createMediaStreamSource(fluxo);
    const an=vozAudio.createAnalyser();
    /* 2048 amostras são 43 ms. Parece pouco, e é o melhor tamanho — medi.
       Fala muda de altura o tempo todo, porque entonação existe; numa
       janela longa a altura varre uma faixa inteira e a correlação num
       atraso fixo cai. Com fala simulada com vibrato de 10%:

           2048 (43 ms)    confiança 0,92 a 0,96   erro 4 a 6%
           4096 (85 ms)    0,91 a 0,93             8 a 9%
           8192 (170 ms)   0,81 a 0,86             7 a 9%

       Com o corte de confiança em 0,90, a janela de 170 ms reprovava
       TODA fala. Eu só não tinha visto antes porque testei com tom puro,
       e tom puro não muda de altura. */
    an.fftSize=2048;
    fonte.connect(an);
    const buf=new Float32Array(an.fftSize);
    /* Oito leituras por segundo bastam: ninguém muda de altura de voz
       em dezessete milissegundos, e a conta não precisa disputar quadro
       com o desenho da tela. */
    let ultima=0;
    const passo=function(agora){
     vozLoop=requestAnimationFrame(passo);
     if(agora-ultima<125)return;
     ultima=agora;
     an.getFloatTimeDomainData(buf);
     const r=alturaDe(buf,vozAudio.sampleRate);
     if(r){
      leituras.push(r.hz);
      elHz.textContent=Math.round(r.hz);
      elNota.textContent=notaDe(r.hz)+' · '+Math.round(r.conf*100)+'% de certeza nesta leitura';
      elConta.textContent=leituras.length+(leituras.length===1?' leitura boa':' leituras boas');
     }else{
      elNota.textContent=leituras.length?'ouvindo…':'fale mais perto, ou mais alto';
     }
     elBarra.style.width=Math.min(100,Math.round((r?r.rms:0)/0.12*100))+'%';
    };
    vozLoop=requestAnimationFrame(passo);
   }).catch(function(){
    $('#vozFim').innerHTML='<p class="tiny" style="color:var(--warn);line-height:1.6">'+
     'Não consegui usar o microfone. Pode ser permissão negada, outro app usando, ou navegador sem suporte. '+
     'Dá para anotar o número na mão na tela de voz, como antes.</p>';
   });
 };
 function fecharMedida(){

function blocoTH(){

 return '<div class="card">'+chTtl('cal','Agenda de aplicação',
   h.length?'<span class="tag n">'+h.length+' registros</span>':'')+
  (ult?'<div class="g3">'+

    tile('Próxima',prox?fmtCurto(prox):'—','a cada '+(th.freq||14)+' dias')+
    tile(faltam>0?'Faltam':faltam===0?'É hoje':'Atrasada',
      faltam>0?faltam:faltam===0?'hoje':Math.abs(faltam),
      faltam>0?'dias':faltam===0?'':'dias',
      faltam<0?'var(--bad)':faltam===0?'var(--warn)':'var(--ok)')+'</div>'
   :'<p class="tiny muted">Registre a aplicação e o app passa a contar os dias até a próxima, no intervalo que você definir.</p>')+

/* =====================================================================
   PRONOME
   O app fala pouco com a pessoa em palavra marcada por gênero, de
   propósito. Onde fala, usa isto. Onde a pessoa não escolheu, continua
   usando as duas formas — nunca escolhe por ela.
   ===================================================================== */
const PRONOMES=[
 {id:'ela',n:'ela/dela',a:'a'},
 {id:'ele',n:'ele/dele',a:'o'},
 {id:'elu',n:'elu/delu',a:'e'},
 {id:'ambos',n:'ela e ele, tanto faz',a:''},
 {id:'',n:'prefiro não dizer',a:''}
];
/* g('lid') devolve "lida", "lido", "lide" ou "lida ou lido", conforme o
   pronome escolhido. A terminação neutra em -e é a mais usada em
   português brasileiro; quem não quiser ela escolhe outra opção. */
function g(raiz,femSuf,mascSuf,neuSuf){
 const f=femSuf||'a', m=mascSuf||'o', n2=neuSuf||'e';
 const p=(PRONOMES.find(x=>x.id===(S.perfil.pronome||''))||{}).a;
 if(p==='a')return raiz+f;
 if(p==='o')return raiz+m;
 if(p==='e')return raiz+n2;
 return raiz+f+' ou '+raiz+m;
}
function pronomeEscolhido(){
 return PRONOMES.find(x=>x.id===(S.perfil.pronome||''))||PRONOMES[PRONOMES.length-1];
}

/* =====================================================================
   QUAL REFERÊNCIA ENTRA NA CONTA
   A fórmula de Mifflin-St Jeor tem uma constante que muda com o sexo
   biológico de referência: +5 ou -161. São 166 kcal de diferença, e é
   só isso que esta pergunta decide. Ela não pergunta quem você é.

   Não existe fórmula validada para quem faz hormonização: a literatura
   simplesmente não tem isso ainda. Por isso quem escolhe "personalizada"
   ou "não sei" recebe o ponto médio entre as duas — e, assim que houver
   registro suficiente, o gasto calculado a partir dos SEUS próprios dados,
   que vale mais que qualquer fórmula.
   ===================================================================== */
const REFS_CALC=[
 {id:'f',n:'Referência fisiológica feminina',
  d:'A constante da fórmula para corpos com fisiologia feminina de referência.'},
 {id:'m',n:'Referência fisiológica masculina',
  d:'A constante para corpos com fisiologia masculina de referência.'},
 {id:'auto',n:'Personalizada, considerando meu contexto hormonal',
  d:'Começa no ponto médio entre as duas e troca pelo seu gasto real assim que você tiver dez dias registrados. É o mais honesto que dá para fazer: não existe fórmula validada para corpos em hormonização.'},
 {id:'naosei',n:'Não sei qual escolher',
  d:'Tudo bem. O app usa o ponto médio e segue. A diferença entre as duas pontas é pequena, e o seu próprio registro corrige isso melhor que a escolha.'}
];
/* A constante de Mifflin-St Jeor. O meio-termo não é invenção: é
   literalmente o ponto médio entre as duas constantes publicadas, usado
   como ponto de partida até os dados da pessoa falarem mais alto. */
function constanteSexo(){
 const x=S.perfil.sexo;
 if(x==='m')return 5;
 if(x==='f')return -161;
 return -78;
}

/* =====================================================================
   SENHA
   Pedida na pesquisa. Não é criptografia e o app diz isso: é uma tela na
   frente, para quem pega seu celular na mão não abrir direto no seu
   histórico. Quem souber abrir o armazenamento do navegador passa por
   cima dela. Para esconder de quem olha por cima do ombro, serve; para
   proteger de quem tem perícia, não.
   ===================================================================== */
function temSenha(){return !!(S.perfil.senha&&S.perfil.senha.length>=4)}
/* Hash simples só para a senha não ficar legível a olho nu em quem abrir
   o armazenamento. Não é proteção criptográfica, e está escrito na tela. */
function hashSenha(t){
 let h=5381;
 const x=String(t);
 for(let i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))>>>0;
 return 'h'+h.toString(36);
}
let destravado=false;
function precisaDestravar(){return temSenha()&&!destravado}
function telaSenha(){
 const box=$('#trava');
 if(!box)return;
 box.hidden=!precisaDestravar();
 if(!precisaDestravar()){document.body.style.overflow='';return}
 document.body.style.overflow='hidden';
 box.innerHTML=
  '<div class="card" style="max-width:340px;width:100%">'+
   '<div class="flagbar" style="margin-bottom:15px"></div>'+
   chTtl('check',nomeDoApp())+
   '<p class="tiny muted" style="line-height:1.65">Digite sua senha para abrir.</p>'+
   '<input type="password" inputmode="numeric" id="senhaIn" placeholder="senha" '+
    'autocomplete="off" style="margin-top:12px;text-align:center;font-size:19px;letter-spacing:.3em">'+
   '<div id="senhaErro" class="tiny" style="color:var(--bad);margin-top:8px;min-height:18px"></div>'+
   '<button class="btn acc bl" style="margin-top:4px" data-a="destravar">Abrir</button>'+
   '<p class="xtiny muted" style="margin-top:13px;line-height:1.6">Esqueceu? Não dá para recuperar, '+
   'porque não existe servidor para pedir. Dá para apagar tudo e começar de novo, '+
   'e isso apaga mesmo — <button class="btn gh xs" data-a="senha-esqueci">como fazer</button></p>'+
  '</div>';
 const i=$('#senhaIn');
 if(i){i.focus();i.addEventListener('keydown',function(e){if(e.key==='Enter')tentarDestravar()});}
}
function tentarDestravar(){
 const i=$('#senhaIn');if(!i)return;
 if(hashSenha(i.value)===S.perfil.senha){
  destravado=true;i.value='';telaSenha();render();
 }else{
  const e=$('#senhaErro');if(e)e.textContent='Senha errada.';
  i.value='';i.focus();
 }
}

/* ---------------------------------------------------------------------

   a literatura diz o contrário: o que derruba osso é passar tempo sem
   hormônio nenhum. Esse é o recado principal, e ele é prático, porque
   falta de medicação acontece no Brasil por desabastecimento e por fila.
   --------------------------------------------------------------------- */

 const T=S.perfil.trilha;
 const linhas=[
  ['O medo é o contrário do achado','Nos estudos, a hormonização em pessoas adultas não aparece associada a perda óssea importante. Na meta-análise com 1.484 homens trans, a densidade na coluna, no quadril, no colo do fêmur e no corpo inteiro não mudou depois de 12 e 24 meses de testosterona, e o marcador de formação de osso subiu.'],

/* =====================================================================
   CONTADOR SEM OFENSIVA
   Veio da pesquisa com estas palavras: "não ter que me sentir obrigado a
   entrar no app todo dia só pra não perder a ofensiva".
   O padrão deixou de ser a sequência que zera. Passou a ser a contagem
   de dias ativos no mês, que só sobe e nunca volta a zero por um dia
   perdido — e dá para desligar completamente.
   ===================================================================== */
const CONTADORES=[
 ['mes','Dias ativos no mês','Conta quantos dias dos últimos 30 tiveram alguma coisa marcada. Nunca zera, e um dia parado não apaga os outros.'],
 ['seq','Dias seguidos','A sequência clássica. Ela volta a zero quando você passa um dia sem marcar nada.'],
 ['off','Nenhum contador','O número some do topo. Seus registros continuam todos lá.']
];
function diasAtivosMes(){
 const vivo=z=>{const x=S.dias[z];return !!(x&&(((x.treino||{}).feito)||(x.agua||0)>0||((x.voz||{}).feito)||
  ((x.pele||{}).manha)||Object.values(x.hig||{}).some(v=>v>0)||MEALS.some(m=>((x.ref||{})[m.k]||[]).length)))};
 let n=0;
 for(let i=0;i<30;i++)if(vivo(addDias(hoje(),-i)))n++;
 return n;
}
function modoContador(){
 const m=S.perfil.contador;
 return CONTADORES.some(c=>c[0]===m)?m:'mes';
}
function cardContador(){
 const m=modoContador();
 return '<div class="card">'+chTtl('flame','O contador do topo')+
  '<p class="tiny muted" style="line-height:1.7">Ninguém deveria abrir um app de saúde por medo de perder uma sequência. '+
  'O padrão conta dias ativos no mês, que nunca zera, e desligar é uma opção de verdade.</p>'+
  '<div class="stack" style="gap:7px;margin-top:12px">'+CONTADORES.map(function(c){
   const on=m===c[0];
   return '<button class="ex'+(on?' done':'')+'" data-a="contador" data-v="'+c[0]+'" style="width:100%;text-align:left">'+
    '<div class="row top" style="gap:10px">'+
    '<span class="chk '+(on?'on':'')+'" style="flex:none">'+ic('check')+'</span>'+
    '<span class="grow"><span class="nm" style="display:block">'+esc(c[1])+'</span>'+

  }).join('')+'</div></div>';
}

   Para quem menstrua, o calendário existe porque a menstruação é um gatilho
   de disforia documentado: numa revisão de 129 adolescentes transmasculinos,
   93% relataram disforia ligada à menstruação. Saber quando vem muda o que
   dá para planejar. O app não sugere nada sobre supressão — isso é conversa
   com quem acompanha a pessoa.

const SINTOMAS=[['disforia','Disforia'],['colica','Cólica'],['humor','Humor baixo'],
 ['cansaco','Cansaço'],['inchaco','Inchaço'],['dorPeito','Dor no peito']];
const NIVEIS=['—','leve','médio','forte'];

function ciclosMedios(){
 const r=(S.ciclo.regras||[]).slice().sort();
 if(r.length<2)return null;
 const gaps=[];
 for(let i=1;i<r.length;i++)gaps.push(diffDias(r[i-1],r[i]));
 const uteis=gaps.filter(g=>g>=15&&g<=60);
 if(!uteis.length)return null;
 const media=Math.round(uteis.reduce((a,b)=>a+b,0)/uteis.length);
 const min=Math.min.apply(null,uteis),max=Math.max.apply(null,uteis);
 return{media,min,max,n:uteis.length,irregular:(max-min)>9};
}
function proximaRegra(){
 const r=(S.ciclo.regras||[]).slice().sort();
 if(!r.length)return null;
 const c=ciclosMedios();
 const prev=addDias(r[r.length-1],c?c.media:28);
 return{d:prev,faltam:diffDias(hoje(),prev),estimado:!c};
}

 const th=S.th||{freq:14,hist:[]},h=(th.hist||[]).slice().sort();

  const ds=ymd(new Date(ano,mes,i));

/* Bloco de vídeos de um assunto.
   Isto aqui dizia que abrir busca era melhor que fixar um vídeo, porque
   canal sai do ar e link quebrado é pior que link nenhum. O raciocínio
   estava certo e a conclusão errada: busca também devolve coisa errada, e
   além disso jogava a pessoa fora do app no meio de uma rotina.
   O que resolve de verdade é conferir cada id antes de entrar e ter um
   caminho quando ele morre — que é o link embaixo de cada player. */
/* Os doze blocos de vídeo do app somavam uns seis mil pixels de altura
   sempre abertos. Agora cada um é uma dobra, fechada por padrão: o título
   diz o que tem ali dentro e quantos vídeos. */
/* Bloco de vídeos, dobrado, com o player dentro.
   Antes havia duas funções quase iguais — uma com player e outra que só
   abria busca no YouTube, embora o cabeçalho fechado das duas dissesse
   "tocam aqui dentro". Agora é uma só, e a frase é verdade.

   O id da dobra leva o id do primeiro vídeo no fim. Antes era só o título,
   e "Ver alguém falando disso" aparece em quatro telas diferentes: abrir
   numa abria em todas as outras. */
function blocoVideos(titulo,lista,nota){
 const n=lista.filter(function(v){return v[0]}).length;
 const id='vid:'+titulo+':'+((lista[0]&&lista[0][0])||lista.length);
 if(!dobrado(id))
  return '<div class="dobra">'+
   '<button class="dh" data-a="dobra" data-id="'+esc(id)+'" aria-expanded="false">'+
   ic('play')+'<span class="grow" style="min-width:0">'+
   '<span class="dt">'+esc(titulo)+'</span>'+
   '<span class="dr">'+lista.length+(lista.length===1?' vídeo':' vídeos')+
    (n===lista.length?', tocam aqui dentro':n?', '+n+' tocam aqui dentro':'')+'</span></span>'+
   '<svg class="ic seta" aria-hidden="true"><use href="#i-right"/></svg></button></div>';
 return '<div class="card">'+chTtl('play',titulo)+
  (nota?'<p class="tiny muted" style="margin-bottom:11px;line-height:1.6">'+nota+'</p>':'')+
  listaVideos(lista)+'</div>';
}

/* =====================================================================
   HUMOR E CABEÇA
   O app dizia, em ficha de evidência, que o que mais pesa na saúde
   mental de pessoas trans é estigma — e não tinha onde registrar nada
   disso. Havia um campo de ânimo escondido numa lista de números do dia.

   O que esta tela NÃO faz, e está escrito nela: não dá nota, não soma
   pontuação e não diz nome de transtorno. Existe instrumento validado
   para isso, e ele vale aplicado e lido por quem foi treinado. App que
   soma pontos e devolve "depressão moderada" está diagnosticando sem ter
   direito, e para quem já apanha do sistema de saúde esse erro custa
   caro.

   O campo 'humor' do dia já existia e continua sendo o ânimo: não criei
   outro para não jogar fora o histórico de quem já usava.
   ===================================================================== */
const ESCALAS_MENTAL=[
 {k:'humor',n:'Ânimo',ic:'sun',cor:'var(--ok)',
  r:['—','No chão','Baixo','Normal','Bom','Ótimo']},
 {k:'ans',n:'Ansiedade',ic:'flame',cor:'var(--warn)',
  r:['—','Nenhuma','Pouca','Média','Alta','Não parava']},
 {k:'dis',n:'Disforia',ic:'face',cor:'var(--pink)',
  r:['—','Nenhuma','Pouca','Média','Alta','Tomou o dia']}
];
const GATILHOS=[
 ['sono','Dormi mal'],['corpo','Corpo e espelho'],['fora','Ser lida errado na rua'],
 ['familia','Família'],['trabalho','Trabalho ou escola'],['dinheiro','Dinheiro'],
 ['saude','Consulta ou exame'],['sozinha','Solidão'],['transfobia','Transfobia direta'],
 ['ciclo','Ciclo ou hormônio'],['bom','Foi um dia bom']
];
function mental(d){
 const x=dia(d);
 x.mental=x.mental||{ans:0,dis:0,gat:[],obs:''};
 if(!Array.isArray(x.mental.gat))x.mental.gat=[];
 return x.mental;
}
function mentalRO(d){
 const x=diaRO(d)||{};
 const m=x.mental||{};
 return{ans:m.ans||0,dis:m.dis||0,gat:Array.isArray(m.gat)?m.gat:[],obs:m.obs||'',humor:x.humor||0};
}
function valorMental(d,k){return k==='humor'?(diaRO(d).humor||0):mentalRO(d)[k]}
/* Ânimo no chão em metade ou mais dos últimos catorze dias REGISTRADOS.
   O limiar é alto o bastante para não assustar por uma semana ruim, e
   baixo o bastante para não esperar um mês. Não fala em doença: fala em
   contar para alguém. */
function animoPesado(){
 const dias=[];for(let i=0;i<14;i++)dias.push(addDias(hoje(),-i));
 const reg=dias.filter(function(d){return (diaRO(d).humor||0)>0});
 if(reg.length<7)return null;
 const baixos=reg.filter(function(d){return diaRO(d).humor<=2}).length;
 return baixos>=7?{baixos:baixos,de:reg.length}:null;
}
function stHumor(){
 const d=hoje(), m=mental(d);
 const pesado=animoPesado();
 const escala=function(e){
  const v=valorMental(d,e.k);
  return '<div style="margin-top:13px"><div class="row spread" style="margin-bottom:6px">'+
   '<span class="lbl" style="margin:0">'+esc(e.n)+'</span>'+
   '<span class="xtiny muted">'+esc(e.r[v]||'—')+'</span></div>'+
   '<div class="row" style="gap:5px">'+[1,2,3,4,5].map(function(i){
    return '<button class="chip'+(v===i?' on':'')+'" data-a="mental-esc" data-k="'+e.k+'" data-v="'+i+'" '+
     'style="flex:1;justify-content:center" aria-label="'+esc(e.n+': '+e.r[i])+'">'+i+'</button>';
   }).join('')+'</div></div>';
 };
 /* Oito semanas das três escalas. É em semana que padrão aparece. */
 const sem=semanasDe(9);
 const serie=function(k){
  const pts=[];
  sem.forEach(function(s2){
   const vs=s2.dias.map(function(dd){return valorMental(dd,k)}).filter(function(v){return v>0});
   if(vs.length)pts.push({x:s2.rot,y:Math.round(vs.reduce(function(a,b){return a+b},0)/vs.length*10)/10});
  });
  return pts;
 };
 const graf=ESCALAS_MENTAL.map(function(e){
  const pts=serie(e.k);
  if(pts.length<2)return '';
  return '<div style="margin-top:14px"><div class="lbl" style="margin-bottom:6px">'+esc(e.n)+'</div>'+
   lineChart(pts,'de 1 a 5',e.cor)+'</div>';
 }).join('');

 $('#st-humor').innerHTML=
  '<div class="card hero">'+chTtl('heart','Humor e cabeça')+
   '<p class="tiny" style="line-height:1.7">Três coisas por dia, e o que estava acontecendo. '+
   'Não é para julgar o dia: é para, daqui a dois meses, você poder olhar e ver padrão — '+
   'e levar isso para a consulta em vez de tentar lembrar.</p>'+
   '<p class="tiny muted" style="line-height:1.7;margin-top:10px"><b>Isto não é teste e não dá nota.</b> '+
   'O app não soma pontuação e não diz nome de transtorno. Existe instrumento certo para isso, '+
   'e ele vale aplicado e lido por quem foi treinado — não por um app.</p></div>'+

  '<div class="card">'+chTtl('sun','Hoje')+
   ESCALAS_MENTAL.map(escala).join('')+
   '<hr class="sep"><div class="lbl" style="margin-bottom:7px">O que pesou hoje <span class="muted">(ou aliviou)</span></div>'+
   '<div class="row wrap" style="gap:5px">'+GATILHOS.map(function(g){
    const on=m.gat.indexOf(g[0])>=0;
    return '<button class="chip xs'+(on?' on':'')+'" data-a="mental-gat" data-v="'+g[0]+'">'+esc(g[1])+'</button>';
   }).join('')+'</div>'+
   '<label class="fld" style="margin-top:12px">Se quiser escrever'+
    '<textarea id="mentalObs" maxlength="600" placeholder="Fica só neste aparelho, como todo o resto" '+
    'style="min-height:80px">'+esc(m.obs)+'</textarea></label>'+
   '<p class="xtiny muted" style="margin-top:8px;line-height:1.6">Dia em branco não vira zero em lugar nenhum: '+
   'não registrar é diferente de estar no chão.</p></div>'+

  (pesado
   ?'<div class="card" style="border-color:var(--warn)">'+chTtl('bell','Faz semanas que está pesado')+

/* Estimativa de gordura corporal a partir das circunferências. */
/* Metas para um peso qualquer — serve para mostrar o que mudou desde
   a pesagem anterior, já que tudo é recalculado sozinho. */
function metasDoPeso(peso){
 const p=S.perfil;
 const tmb=10*peso+6.25*p.altura-5*p.idade+constanteSexo();
 const gasto=tmb*p.ativ;
 let kcal=Math.round((p.obj==='perder'?gasto*.8:p.obj==='ganhar'?gasto*1.15:gasto)/10)*10;
 if(kcal<tmb*1.05)kcal=Math.ceil(tmb*1.05/10)*10;
 if(kcal<1200)kcal=1200;
 if(p.obj==='perder'&&imcDe(peso)<18.5)kcal=Math.round(gasto/10)*10;
 return{kcal,prot:Math.round(peso*(p.obj==='perder'?2.2:1.8)),
  agua:(p.sexo==='m'?2000:p.sexo==='f'?1600:1800),tmb:Math.round(tmb)};
}
function blocoRecalculo(){
 const ps=S.pesos.slice().sort((a,b)=>a.d<b.d?-1:1);
 if(ps.length<2)return '';
 const atual=ps[ps.length-1];
 const antes=ps.filter(p=>diffDias(p.d,atual.d)<=45)[0];
 if(!antes||antes.d===atual.d)return '';
 const a=metasDoPeso(antes.v),b=metasDoPeso(atual.v);
 const mudou=(a.kcal!==b.kcal)||(a.prot!==b.prot)||(a.agua!==b.agua);
 const med=S.medidas.slice().sort((x,y)=>x.d<y.d?-1:1);
 const m0=med[0],m1=med[med.length-1];
 const difMed=(m0&&m1&&m0!==m1)?CAMPOS.filter(([k])=>m0[k]&&m1[k]&&Math.abs(m1[k]-m0[k])>=0.5)
  .map(([k,n])=>n+' '+(m1[k]-m0[k]>0?'+':'')+n1(m1[k]-m0[k])):[];
 return '<div class="card">'+chTtl('redo','O que mudou com a sua evolução')+
  '<p class="tiny muted" style="margin-bottom:11px">Tudo no app é recalculado a partir do seu peso atual. '+
  'Comparando <b>'+fmtCurto(antes.d)+'</b> com <b>'+fmtCurto(atual.d)+'</b>:</p>'+
  '<div class="stack" style="gap:0">'+
  [['Peso',n1(antes.v)+' kg',n1(atual.v)+' kg'],
   ['Meta de calorias',a.kcal+' kcal',b.kcal+' kcal'],
   ['Meta de proteína',a.prot+' g',b.prot+' g'],
   ['Meta de água',(a.agua/1000).toFixed(1)+' L',(b.agua/1000).toFixed(1)+' L'],
   ['Gasto em repouso',a.tmb+' kcal',b.tmb+' kcal']].map(([n,x,y])=>
   '<div class="li"><div class="grow"><div class="ttl">'+n+'</div></div>'+
   '<div class="num tiny muted">'+x+'</div>'+ic('right','color:var(--ink-3);font-size:13px')+
   '<div class="num tiny" style="font-weight:600">'+y+'</div></div>').join('')+'</div>'+
  (difMed.length?'<p class="tiny" style="margin-top:11px;color:var(--ok)">Nas medidas: '+esc(difMed.join(' · '))+' cm.</p>':'')+
  '<p class="xtiny muted" style="margin-top:10px;line-height:1.6">'+
  (mudou?'As metas acima já estão valendo — você não precisa ajustar nada na mão.'
   :'A variação foi pequena demais para mexer nas metas.')+
  (S.perfil.thIni?' Em hormonização, peso parado pode significar gordura saindo e músculo entrando ao mesmo tempo: '+
   'é por isso que medida e foto contam mais que a balança aqui.':'')+'</p></div>';
}
/* A proporção que importa depende da trilha: ombro sobre cintura descreve
   a leitura masculina; cintura sobre quadril, a feminina. Na trilha de
   bem-estar não existe alvo estético nenhum — só o número. */
function proporcaoDaTrilha(m){
 if(!m)return '';
 const t=S.perfil.trilha;
 if(t==='masc'&&m.ombro&&m.cintura){
  const v=n1(m.ombro/m.cintura);
  return '<p class="tiny muted" style="margin-top:10px">Ombro ÷ cintura: <b class="num">'+v+'</b>. '+
   'É a proporção que mais descreve a leitura masculina do corpo — referência entre 1,4 e 1,6. '+
   'Dá para subir dos dois lados: ganhando ombro e dorsal, e segurando a cintura.</p>';
 }
 if(t==='fem'&&m.cintura&&m.quadril){
  const v=n1(m.cintura/m.quadril);
  return '<p class="tiny muted" style="margin-top:10px">Cintura ÷ quadril: <b class="num">'+v+'</b>. '+
   'É a proporção que mais descreve a leitura feminina do corpo — referência entre 0,7 e 0,8. '+
   'Treino de glúteo e perna mexe no denominador; cintura firme, sem engrossar os oblíquos, mexe no numerador.</p>';
 }
 if(t==='bem')return '<p class="xtiny muted" style="margin-top:10px">Aqui as medidas servem só para você acompanhar '+
  'o próprio corpo ao longo do tempo. Não há número certo nem meta estética.</p>';
 const falta=t==='fem'?'cintura e quadril':'ombro e cintura';
 return '<p class="xtiny muted" style="margin-top:10px">Registre '+falta+' na mesma medição para ver a proporção.</p>';
}

/* ---------------------------------------------------------------------
   TENDÊNCIA POR SEMANA
   O app desenhava carga, peso, medida, Hz da voz e volume de treino, e
   não desenhava nada do que a pessoa registra todo dia. Média de trinta
   dias esconde a única coisa que interessa aqui, que é a direção.

   Semana sem registro nenhum não vira zero: zero por não ter anotado é
   diferente de zero por não ter feito, e desenhar um despenque que foi
   só falta de anotação é mentir em forma de gráfico.
   --------------------------------------------------------------------- */
function semanasDe(n){
 const out=[];
 for(let k=n-1;k>=0;k--){
  const fim=addDias(hoje(),-k*7), ini=addDias(fim,-6), dias=[];
  for(let i=0;i<7;i++)dias.push(addDias(ini,i));
  out.push({rot:fmtCurto(ini),dias:dias.filter(function(d){return d<=hoje()})});
 }
 return out.filter(function(s2){return s2.dias.length});
}
function blocoTendencia(){
 const sem=semanasDe(13), m=metas();
 const comer=[],prot=[],agua=[],const_=[];
 sem.forEach(function(s2){
  const comReg=s2.dias.filter(function(d){
   return MEALS.some(function(x){return ((diaRO(d).ref||{})[x.k]||[]).length})});
  if(comReg.length){
   comer.push({x:s2.rot,y:Math.round(comReg.reduce(function(a,d){return a+totalDia(d).kcal},0)/comReg.length)});
   prot.push({x:s2.rot,y:Math.round(comReg.reduce(function(a,d){return a+totalDia(d).p},0)/comReg.length)});
  }
  const comA=s2.dias.filter(function(d){return diaRO(d).agua>0});
  if(comA.length)agua.push({x:s2.rot,y:Math.round(comA.reduce(function(a,d){return a+diaRO(d).agua},0)/comA.length)});
  /* Constância conta os três hábitos diários que o app acompanha, sobre
     o total possível da semana. Semana sem nada registrado fica de fora. */
  let feitos=0;
  s2.dias.forEach(function(d){
   const x=diaRO(d);
   if((x.treino||{}).feito)feitos++;
   if((x.voz||{}).feito)feitos++;
   if((x.pele||{}).manha&&(x.pele||{}).noite)feitos++;
  });
  if(feitos)const_.push({x:s2.rot,y:Math.round(feitos/(s2.dias.length*3)*100)});
 });
 const nada=!comer.length&&!agua.length&&!const_.length;
 const um=function(tit,pts,unid,cor,meta,nota){
  if(pts.length<2)return '';
  return '<div style="margin-top:14px"><div class="lbl" style="margin-bottom:6px">'+esc(tit)+'</div>'+
   lineChart(pts,unid,cor,meta)+
   (nota?'<p class="xtiny muted" style="margin-top:6px;line-height:1.5">'+esc(nota)+'</p>':'')+'</div>';
 };
 return dobra('prog:tend','Como vem indo, semana a semana','chart',
  nada?'precisa de pelo menos duas semanas com registro':'caloria, proteína, água e constância nos últimos três meses',
  function(){
  if(nada)return '<div class="card">'+chTtl('chart','Como vem indo, semana a semana')+
   vazio('chart','Registre comida, água ou os hábitos do dia por duas semanas e os gráficos aparecem aqui.')+'</div>';
  return '<div class="card">'+chTtl('chart','Como vem indo, semana a semana')+
   '<p class="tiny muted" style="line-height:1.65">Média por semana, não por dia: dia a dia é ruído, e semana é o menor pedaço '+
   'em que dá para ver direção. A linha atravessada é a sua meta.</p>'+
   (oculto('kcal')?'':um('Caloria por dia',comer,'kcal','var(--accent)',m.kcal))+
   (oculto('kcal')?'':um('Proteína por dia',prot,'g','var(--primary)',m.prot))+
   um('Água por dia',agua,'ml','var(--water)',m.agua)+
   um('Constância',const_,'%','var(--ok)',null,
    'Quantos dos hábitos do dia — treino, voz e pele — você fechou, sobre o total possível da semana. '+
    'É o gráfico que mostra progresso sem falar de peso.')+
   '<p class="xtiny muted" style="margin-top:12px;line-height:1.6">Semana sem nada registrado não entra como zero: '+
   'não anotar é diferente de não fazer, e um buraco no gráfico por falta de registro seria um gráfico mentindo.</p></div>';
 });
}

function stResumo(){

 const m=metas();
 const comReg=dias.filter(d=>MEALS.some(x=>((diaRO(d).ref||{})[x.k]||[]).length));
 const med=(f,arr)=>arr.length?Math.round(arr.reduce((a,d)=>a+f(d),0)/arr.length):0;
 const mediaK=med(d=>totalDia(d).kcal,comReg),mediaP=med(d=>totalDia(d).p,comReg);
 const comAgua=dias.filter(d=>diaRO(d).agua);

   .map(([n,v,mx])=>'<div><div class="row spread tiny" style="margin-bottom:3px"><span style="font-weight:600">'+n+'</span>'+
    '<span class="num muted">'+Math.round(((v||0)/mx)*100)+'%</span></div>'+barra(v,mx,'var(--blue)')+'</div>').join('')+
  '</div></div>'+
  '<div class="card">'+chTtl('info','Leitura do período',

  stConquistas();
}
function leitura(ades,k,p,m,ps,vozes){
 const t=[];
 if(!k)t.push('Ainda não há refeições registradas suficientes para uma análise. Registre pelo menos uma semana completa para os números fazerem sentido.');
 else{
  /* quem escondeu os números não recebe a conta por escrito, e muito
     menos convertida em quilos de gordura por mês */
  if(oculto('kcal')){
   if(k>m.kcal*1.08)t.push('Você tem comido acima da sua meta na média do mês. Sem número, para não atrapalhar: se quiser ver quanto, dá para voltar a mostrar no Perfil.');
   else if(k<m.kcal*.85)t.push('Você tem comido bem abaixo da meta na média do mês. Comer pouco demais derruba o rendimento no treino e faz perder massa junto com a gordura — e isso vale mesmo sem olhar número.');
   else t.push('Sua média do mês está dentro da faixa da meta.');
  }
  else if(k>m.kcal*1.08)t.push('Sua média calórica está cerca de '+Math.round(k-m.kcal)+' kcal por dia acima da meta — o equivalente a aproximadamente '+n1((k-m.kcal)*30/7700)+' kg de gordura por mês.');
  else if(k<m.kcal*.85)t.push('Sua média está bem abaixo da meta. Déficit grande demais derruba o rendimento no treino e faz perder massa muscular junto com a gordura.');
  else t.push('Sua média calórica está dentro da faixa da meta, que é exatamente onde o resultado aparece de forma consistente.');
  if(oculto('kcal')){
   if(p<m.prot*.85)t.push('A proteína está abaixo do alvo. Uma fonte proteica a mais no lanche da tarde costuma resolver.');
   else t.push('A proteína está no alvo, que é o que mais protege a massa muscular.');
  }
  else if(p<m.prot*.85)t.push('A proteína está abaixo do alvo: faltam cerca de '+Math.round(m.prot-p)+' g por dia. Uma fonte proteica a mais no lanche da tarde resolve.');
  else if(!oculto('kcal'))t.push('A proteína está no alvo, que é o fator que mais protege a massa muscular.');
 }
 if(ades>=80)t.push('A adesão ao treino está ótima — constância vale mais que intensidade.');
 else if(ades>0)t.push('A adesão ao treino está em '+ades+'%. Se a rotina apertou, troque a academia por casa ou calistenia: os três estão montados no app.');
 if(vozes>=20)t.push('O treino de voz está muito constante, e constância é justamente o que faz a voz mudar.');
 else if(vozes>0)t.push('Foram '+vozes+' dias de treino de voz no período. Dez minutos por dia rendem mais que uma hora no fim de semana.');
 if(ps&&ps.length>1){const d=n1(ps[ps.length-1].v-ps[0].v);
  t.push('No período o peso variou '+(d>0?'+':'')+d+' kg.');}
 return t.join(' ');
}

   PERFIL
   Uma página só, na ordem de preencher.
   Primeiro tudo que tem campo, escolha ou chave para marcar; depois o
   texto. Era em cinco sub-abas, e isso escondia metade do formulário:
   quem abria a primeira não tinha como saber que havia mais quatro.
   ===================================================================== */

   ligar. Esta é a ordem em que as coisas fazem sentido serem preenchidas. */
const PF_FORM=[

 pf_contador,
 pf_lembAgua,

 pf_disfarce,
 pf_senha
];
/* Não se preenche: é o que o app faz com o que você preencheu, e o que ele
   avisa. Fica embaixo, fora do caminho de quem está montando o perfil. */
const PF_LEITURA=[
 pf_guardar,    /* exportar e apagar */
 pf_avisosAqui,
 pf_avisosDano,
 pf_desligar,

];

  PF_LEITURA.map(f=>f()).join('');
}
